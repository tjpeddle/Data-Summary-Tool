    </div>

    {/* Academic Accommodations */}
    <div style={{marginBottom:8}}>
      <p style={{fontSize:13,color:CO.accent,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:12}}>◎ Academic Accommodations (including Testing)</p>
      {acadSummary.length?<AccomTable summary={acadSummary} color={CO.accent}/>:<p style={{color:CO.dim,fontSize:13,marginBottom:20}}>No academic accommodations found.</p>}
    </div>

    {/* Housing Accommodations */}
    <div style={{marginBottom:24}}>
      <p style={{fontSize:13,color:CO.purple,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:12}}>⌂ Housing Accommodations</p>
      {housSummary.length?<AccomTable summary={housSummary} color={CO.purple}/>:<p style={{color:CO.dim,fontSize:13,marginBottom:20}}>No housing accommodations found.</p>}
    </div>

    {/* Incoming Totals by Class Type */}
    <div style={{borderTop:`2px solid ${gold}30`,paddingTop:24,marginBottom:8}}>
      <p style={{fontSize:13,color:gold,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:16}}>🎓 Incoming Totals by Class Type</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:16}}>
        {byClass.map(c=>(
          <div key={c.label} style={{background:CO.card,borderRadius:14,border:`1.5px solid ${gold}30`,padding:"18px 20px"}}>
            <p style={{fontSize:11,color:gold,fontWeight:700,marginBottom:12}}>{c.label}</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <div style={{textAlign:"center",padding:"10px 6px",borderRadius:8,background:`${CO.green}0c`}}>
                <p style={{fontSize:10,color:CO.dim,textTransform:"uppercase",letterSpacing:".04em",marginBottom:2}}>Approved</p>
                <p style={{fontSize:24,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.green}}>{c.appr}</p>
              </div>
              <div style={{textAlign:"center",padding:"10px 6px",borderRadius:8,background:`${CO.red}0c`}}>
                <p style={{fontSize:10,color:CO.dim,textTransform:"uppercase",letterSpacing:".04em",marginBottom:2}}>Denied Only</p>
                <p style={{fontSize:24,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.red}}>{c.denied}</p>
              </div>
            </div>
            <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
              <span style={{fontSize:11,color:CO.accent}}>◎ {c.acadAppr} academic</span>
              {c.housAppr>0&&<span style={{fontSize:11,color:CO.purple}}>⌂ {c.housAppr} housing</span>}
              {c.testAppr>0&&<span style={{fontSize:11,color:CO.orange}}>✎ {c.testAppr} testing</span>}
            </div>
          </div>
        ))}
      </div>

      {/* Grand total banner */}
      <div style={{padding:"16px 24px",borderRadius:14,background:`${gold}0c`,border:`1.5px solid ${gold}30`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:16}}>
        <div>
          <p style={{fontSize:11,color:gold,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:4}}>🎓 Incoming Grand Total</p>
          <p style={{fontSize:12,color:CO.dim}}>{uniqueApprTotal} incoming students approved out of {uniqueTotal} who interacted with OARS — {deniedOnlySids.size} had no approvals.</p>
        </div>
        <div style={{display:"flex",gap:28}}>
          <StatBlock label="Interacted" val={uniqueTotal} color={gold} size={28}/>
          <StatBlock label="Approved" val={uniqueApprTotal} color={CO.green} size={28}/>
          <StatBlock label="Denied All" val={deniedOnlySids.size} color={CO.red} size={28}/>
        </div>
      </div>
    </div>
  </div>);
}

/* ═══ MAIN APP ═══ */
function App(){
  /* ── localStorage persistence helpers ── */
  const LS_KEYS={raw:"oars_raw",test:"oars_test",testAccom:"oars_testAccom",appt:"oars_appt",caseNotes:"oars_caseNotes",studentNotes:"oars_studentNotes",incoming:"oars_incoming",ay:"oars_ay",preSummer:"oars_preSummer",enrolledOnly:"oars_enrolledOnly"};
  const lsLoad=(key)=>{try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}};
  const lsSave=(key,val)=>{
    if(!val||!val.length){try{localStorage.removeItem(key);}catch(e){}return true;}
    try{localStorage.setItem(key,JSON.stringify(val));return true;}
    catch(e){
      // Too large — try saving a trimmed version as a size hint, then clear
      try{localStorage.removeItem(key);}catch(e2){}
      console.warn("localStorage quota exceeded for",key,"— dataset too large to cache.");
      return false;
    }
  };
  const lsSizeOk=(val)=>{try{const s=JSON.stringify(val);return s.length<3000000;}catch(e){return false;}};

  const[rawData,setRawData]=useState([]);
  const[testRoomData,setTestRoomData]=useState([]);
  const[testAccomData,setTestAccomData]=useState([]);
  const[apptData,setApptData]=useState([]);
  const[caseNotesData,setCaseNotesData]=useState([]);
  const[studentNotesData,setStudentNotesData]=useState([]);
  const[incomingData,setIncomingData]=useState([]);
  const[cacheMode,setCacheMode]=useState("loading"); // loading | idb | local
  const hydrated=useRef(false);
  const[execStats,setExecStats]=useState(null);
  const[ay,setAY]=useState(()=>lsLoad(LS_KEYS.ay)||"2024-2025");const[tab,setTab]=useState("import");
  const[inclPreSummer,setInclPreSummer]=useState(()=>{const v=lsLoad(LS_KEYS.preSummer);return v===null?false:v});
  const[enrolledOnly,setEnrolledOnly]=useState(()=>{const v=lsLoad(LS_KEYS.enrolledOnly);return v===null?true:v});

  const ys=parseInt(ay.split("-")[0]),fS=`Fall ${ys}`,wS=`Winter ${ys}`,sS=`Spring ${ys+1}`,suS=`Summer ${ys+1}`,suPre=`Summer ${ys}`;
  const T={fS,wS,sS,suS,suPre};

  /* ── "Enrolled only" filter ───────────────────────────────────────────
     The Academic & Housing export carries an Enrolled (Yes/No) column: one
     row per student x accommodation x course. Rows marked No are course
     registrations the student dropped. Default is ON, so counts reflect
     actively enrolled coursework. ─────────────────────────────────────── */
  const enrollAvailable=hasEnrolledCol(rawData)||hasEnrolledCol(testAccomData);
  const notEnrolledCount=useMemo(()=>[...rawData,...testAccomData].filter(r=>hasEnrolledCol([r])&&!isEnrolled(r)).length,[rawData,testAccomData]);
  const rawE=useMemo(()=>applyEnrolled(rawData,enrolledOnly),[rawData,enrolledOnly]);
  const testAccomE=useMemo(()=>applyEnrolled(testAccomData,enrolledOnly),[testAccomData,enrolledOnly]);

  /* ── Leading-summer detection ─────────────────────────────────────────
     Summer {ys} (e.g. Summer 2025) sits BEFORE the fall term. Some exports
     include it, some don't — so it is offered as a toggle only when rows
     for it are actually present. ──────────────────────────────────────── */
  const preSummerCount=useMemo(()=>{
    let n=0;
    [rawE,testAccomE].forEach(ds=>ds.forEach(r=>{if(normTerm(r["Semester (course)"])===suPre)n++}));
    testRoomData.forEach(r=>{if(normTerm(r["Semester"])===suPre)n++});
    apptData.forEach(r=>{if(semOf(r["AppointmentDate"])===suPre)n++});
    [...caseNotesData,...studentNotesData].forEach(r=>{if(semOf(r["Created"]||r["Date Created (Student)"])===suPre)n++});
    return n;
  },[rawE,testAccomE,testRoomData,apptData,caseNotesData,studentNotesData,suPre]);
  const preSummerAvailable=preSummerCount>0;
  const showPreSummer=preSummerAvailable&&inclPreSummer;

  // Canonical term set. Leading summer is prepended only when toggled on.
  const TERMS=useMemo(()=>[
    ...(showPreSummer?[{key:"summerPre",label:suPre,col:"#e0705a"}]:[]),
    {key:"fall",label:fS,col:CO.orange},
    {key:"winter",label:wS,col:"#5cc9f5"},
    {key:"spring",label:sS,col:CO.green},
    {key:"summer",label:suS,col:CO.yellow},
  ],[showPreSummer,suPre,fS,wS,sS,suS]);

  /* ── Scope every dataset to the active terms ──────────────────────────
     This is what makes the toggles mean something: totals are computed
     from scoped rows, so Fall + Winter + Spring + Summer always equals
     the Total. Anything outside the year is reported, not silently kept. */
  const semField=r=>normTerm(r["Semester (course)"]);
  const acadS =useMemo(()=>scopeRows(rawE,semField,TERMS),[rawE,TERMS]);
  const taS   =useMemo(()=>scopeRows(testAccomE,semField,TERMS),[testAccomE,TERMS]);
  const bookS =useMemo(()=>scopeRows(testRoomData,r=>normTerm(r["Semester"]!==undefined&&r["Semester"]!==""?r["Semester"]:(r["Date"]||r["Exam Date"]||r["AppointmentDate"])),TERMS),[testRoomData,TERMS]);
  const apptS =useMemo(()=>scopeRows(apptData,r=>semOf(r["AppointmentDate"]),TERMS),[apptData,TERMS]);
  const cnS   =useMemo(()=>scopeRows(caseNotesData,r=>semOf(r["Created"]),TERMS),[caseNotesData,TERMS]);
  const snS   =useMemo(()=>scopeRows(studentNotesData,r=>semOf(r["Date Created (Student)"]),TERMS),[studentNotesData,TERMS]);
  const rawF=acadS.rows, testAccomF=taS.rows;
  const totalExcluded=acadS.outOfScope+taS.outOfScope+bookS.outOfScope+apptS.outOfScope+cnS.outOfScope+snS.outOfScope;

  /* Hydrate every dataset once, from IndexedDB when available.
     Anything still sitting in localStorage from an older version is
     migrated across on first run. */
  const SETTERS={raw:setRawData,test:setTestRoomData,testAccom:setTestAccomData,appt:setApptData,caseNotes:setCaseNotesData,studentNotes:setStudentNotesData,incoming:setIncomingData};
  useEffect(()=>{
    let dead=false;
    (async()=>{
      const useIdb=await idbAvailable();
      for(const k of Object.keys(SETTERS)){
        let v=null;
        if(useIdb){try{v=await idbGet(k)}catch(e){v=null}}
        if(!v||!v.length){
          const legacy=lsLoad(LS_KEYS[k]);
          if(legacy&&legacy.length){v=legacy;if(useIdb)idbSet(k,legacy).catch(()=>{});}
        }
        if(v&&v.length&&!dead)SETTERS[k](v);
      }
      if(!dead){setCacheMode(useIdb?"idb":"local");hydrated.current=true;}
    })();
    return()=>{dead=true};
  },[]);

  /* Persist on change — skipped until hydration finishes so the initial
     empty state never wipes the cache. */
  const persist=(k,val)=>{
    if(!hydrated.current)return;
    if(cacheMode==="idb"){(val&&val.length?idbSet(k,val):idbDel(k)).catch(e=>console.warn("IndexedDB save failed for",k,e));}
    else lsSave(LS_KEYS[k],val);
  };
  useEffect(()=>{persist("raw",rawData)},[rawData]);
  useEffect(()=>{persist("test",testRoomData)},[testRoomData]);
  useEffect(()=>{persist("testAccom",testAccomData)},[testAccomData]);
  useEffect(()=>{persist("appt",apptData)},[apptData]);
  useEffect(()=>{persist("caseNotes",caseNotesData)},[caseNotesData]);
  useEffect(()=>{persist("studentNotes",studentNotesData)},[studentNotesData]);
  useEffect(()=>{persist("incoming",incomingData)},[incomingData]);
  useEffect(()=>{lsSave(LS_KEYS.ay,ay);},[ay]);
  useEffect(()=>{try{localStorage.setItem(LS_KEYS.preSummer,JSON.stringify(inclPreSummer))}catch(e){}},[inclPreSummer]);
  useEffect(()=>{try{localStorage.setItem(LS_KEYS.enrolledOnly,JSON.stringify(enrolledOnly))}catch(e){}},[enrolledOnly]);

  // Pre-compute exec stats after any data change — runs in background after render
  useEffect(()=>{
    if(!rawF.length){setExecStats(null);return;}
    const tid=setTimeout(()=>{
      const sid=r=>r["Student ID"]||r["Name"]||"?";
      const isAppr=r=>(r["Approved"]||"").toLowerCase()==="approved";
      const isDen=r=>(r["Approved"]||"").toLowerCase()==="denied";
      const approvedSids=new Set();const allSids=new Set();
      const acadMap={};const housMap={};
      rawF.forEach(r=>{
        const s=sid(r);const a=r["Requested Accommodation"]||"";const appr=isAppr(r);const den=isDen(r);
        allSids.add(s);if(appr)approvedSids.add(s);
        if(isA(a)){
          if(!acadMap[a])acadMap[a]={ap:new Set(),dn:new Set()};
          if(appr)acadMap[a].ap.add(s);else if(den)acadMap[a].dn.add(s);
        }else if(isH(a)){
          const n=cHN(a)||a;
          if(!housMap[n])housMap[n]={ap:new Set(),dn:new Set()};
          if(appr)housMap[n].ap.add(s);else if(den)housMap[n].dn.add(s);
        }
      });
      const deniedOnlySids=new Set([...allSids].filter(s=>!approvedSids.has(s)));
      const acadArr=Object.entries(acadMap).map(([name,v])=>({name,approved:v.ap.size,denied:v.dn.size,total:v.ap.size+v.dn.size})).sort((a,b)=>b.total-a.total);
      const housArr=Object.entries(housMap).map(([name,v])=>({name,approved:v.ap.size,denied:v.dn.size,total:v.ap.size+v.dn.size})).sort((a,b)=>b.total-a.total);
      // Testing — bucket every booking by canonical term
      let testBooked=0,testDelivered=0,testCancelled=0;
      const termList=TERMS.map(t=>t.label);
      const testsByTerm={};termList.forEach(t=>testsByTerm[t]=0);
      bookS.rows.forEach(r=>{testBooked++;const c=(r["Appointment Cancelled"]||"").toLowerCase()==="yes";if(!c)testDelivered++;else testCancelled++;
        const t=normTerm(r["Semester"]);if(testsByTerm[t]!==undefined)testsByTerm[t]++;});
      const gT=l=>testsByTerm[l]||0;
      const fallTests=gT(`Fall ${ys}`),winterTests=gT(`Winter ${ys}`),springTests=gT(`Spring ${ys+1}`),summerTests=gT(`Summer ${ys+1}`);
      const testAccomApproved=testAccomF.length?new Set(testAccomF.filter(r=>(r["Approved"]||"").toLowerCase()==="approved").map(r=>r["Student ID"]||r["Name"])).size:null;
      // Appts — total plus a per-term split derived from AppointmentDate
      let apptCount=0,apptMins=0;
      const apptByTerm={};termList.forEach(t=>apptByTerm[t]={n:0,mins:0});
      apptS.rows.forEach(r=>{if((r["Appointment Cancelled"]||"").toLowerCase()!=="yes"){
        const m=parseInt(r["Appointment Length"])||0;apptCount++;apptMins+=m;
        const t=semOf(r["AppointmentDate"]);if(apptByTerm[t]){apptByTerm[t].n++;apptByTerm[t].mins+=m;}}});
      const apptTermRows=termList.map(t=>({label:t,n:apptByTerm[t].n,hrs:(apptByTerm[t].mins/60).toFixed(1)}));
      // Notes
      let notesMins=0,notesCount=0;
      [...cnS.rows,...snS.rows].forEach(r=>{notesCount++;notesMins+=parseInt(r["Duration (Case)"]||r["Duration (Student)"])||0;});
      // Incoming
      const inWith=incomingData.filter(r=>(r["Requested Accommodation"]||"").trim());
      const inApprSids=new Set(inWith.filter(r=>(r["_ApprovedStatus"]||"").toLowerCase()==="approved").map(r=>r["Student ID"]||r["Name"]));
      const inAllSids=new Set(inWith.map(r=>r["Student ID"]||r["Name"]));
      setExecStats({
        uniqueStudents:allSids.size,approvedStudents:approvedSids.size,deniedOnly:deniedOnlySids.size,
        acadArr,housArr,
        testBooked,testDelivered,testCancelled,fallTests,springTests,summerTests,winterTests,testsByTerm,testAccomApproved,
        apptTermRows,
        apptCount,apptHrs:apptS.rows.length?(apptMins/60).toFixed(1):null,
        notesCount,notesHrs:notesCount?(notesMins/60).toFixed(1):null,
        hasAppt:apptS.rows.length>0,hasNotes:notesCount>0,hasTest:bookS.rows.length>0,hasIncoming:incomingData.length>0,
        inTotal:inAllSids.size,inApproved:inApprSids.size,
      });
    },100);
    return()=>clearTimeout(tid);
  },[rawF,bookS,testAccomF,apptS,cnS,snS,incomingData,ay,TERMS]);
  const[iSt,setISt]=useState({raw:null,test:null,testaccom:null,appt:null,casenotes:null,studentnotes:null,incoming:null});const[ld,setLd]=useState(false);
  const tabs=[
    {id:"import",label:"Import Data",icon:"↑"},
    {id:"summary",label:"Executive Summary",icon:"◈"},
    {id:"academic",label:"Academic Accomm.",icon:"◎"},
    {id:"housing",label:"Housing Report",icon:"⌂"},
    {id:"testroom",label:"Test Room Bookings",icon:"✎"},
    {id:"appointments",label:"Direct Services",icon:"🤝"},
    {id:"indirect",label:"Indirect Contacts",icon:"📬"},
    {id:"incoming",label:"New Student Reg.",icon:"🎓"},
    {id:"students",label:"Student Enrollment",icon:"⦿"},
    {id:"export",label:"Export as Excel",icon:"↓"},
    {id:"generate",label:"Generate Word Report",icon:"📄"},
  ];

  return(<div style={{minHeight:"100vh",background:CO.bg,color:CO.text,fontFamily:"'Outfit',sans-serif"}}>
    <header style={{background:CO.card,borderBottom:`1px solid ${CO.border}`,padding:"14px 32px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:42,height:42,borderRadius:12,background:`linear-gradient(135deg,${CO.accent},${CO.purple})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:800}}>DS</div>
        <div><h1 style={{fontSize:17,fontWeight:800}}>Disability Services Report Tool</h1><p style={{fontSize:11.5,color:CO.muted}}>Annual Accommodation & Testing Analysis</p></div></div>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <label style={{fontSize:12.5,color:CO.muted}}>Academic Year:</label>
        <select value={ay} onChange={e=>setAY(e.target.value)} style={{background:CO.bg,color:CO.text,border:`1.5px solid ${CO.border}`,borderRadius:8,padding:"7px 14px",fontSize:14,fontFamily:"'JetBrains Mono',monospace",fontWeight:600}}>
          {["2019-2020","2020-2021","2021-2022","2022-2023","2023-2024","2024-2025","2025-2026","2026-2027","2027-2028","2028-2029","2029-2030","2030-2031","2031-2032","2032-2033"].map(y=><option key={y} value={y}>{y}</option>)}</select>
        {preSummerAvailable&&<label title={`${preSummerCount.toLocaleString()} records fall in ${suPre}, the summer term before ${fS}.`} style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",padding:"5px 12px",borderRadius:24,background:showPreSummer?"#e0705a20":"transparent",border:`1.5px solid ${showPreSummer?"#e0705a":CO.border}`}}>
          <input type="checkbox" checked={inclPreSummer} onChange={e=>setInclPreSummer(e.target.checked)} style={{accentColor:"#e0705a",cursor:"pointer",width:14,height:14}}/>
          <span style={{fontSize:12,fontWeight:600,color:showPreSummer?"#e0705a":CO.muted,whiteSpace:"nowrap"}}>Include {suPre}</span>
          <span style={{fontSize:10.5,color:CO.dim,fontFamily:"'JetBrains Mono',monospace"}}>{preSummerCount.toLocaleString()}</span>
        </label>}
        {enrollAvailable&&<label title="The Academic & Housing export has one row per student x accommodation x course. Rows marked Enrolled=No are dropped course registrations." style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer",padding:"5px 12px",borderRadius:24,background:enrolledOnly?`${CO.green}18`:"transparent",border:`1.5px solid ${enrolledOnly?CO.green:CO.border}`}}>
          <input type="checkbox" checked={enrolledOnly} onChange={e=>setEnrolledOnly(e.target.checked)} style={{accentColor:CO.green,cursor:"pointer",width:14,height:14}}/>
          <span style={{fontSize:12,fontWeight:600,color:enrolledOnly?CO.green:CO.muted,whiteSpace:"nowrap"}}>Enrolled only</span>
          {notEnrolledCount>0&&<span style={{fontSize:10.5,color:CO.dim,fontFamily:"'JetBrains Mono',monospace"}}>&minus;{notEnrolledCount.toLocaleString()}</span>}
        </label>}
        <div style={{padding:"5px 14px",borderRadius:24,background:rawF.length?`${CO.green}18`:`${CO.red}18`,color:rawF.length?CO.green:CO.red,fontSize:12,fontWeight:600}}>{rawF.length?`${rawF.length.toLocaleString()} records`:"No data"}</div>
      </div></header>
    <div style={{display:"flex",height:"calc(100vh - 71px)"}}>
      <nav style={{width:220,background:CO.card,borderRight:`1px solid ${CO.border}`,padding:"20px 0",flexShrink:0,overflowY:"auto"}}>
        {tabs.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"11px 18px",background:tab===t.id?CO.accentSoft:"transparent",border:"none",borderLeft:tab===t.id?`3px solid ${CO.accent}`:"3px solid transparent",color:tab===t.id?CO.accent:CO.muted,cursor:"pointer",fontSize:13,fontFamily:"inherit",fontWeight:tab===t.id?700:400,transition:"all .15s"}}><span style={{fontSize:14,width:20,textAlign:"center"}}>{t.icon}</span>{t.label}</button>)}
        <div style={{margin:"16px 18px",padding:14,background:CO.bg,borderRadius:12,border:`1px solid ${CO.border}`}}>
          <p style={{fontSize:11,color:CO.dim,fontWeight:500,textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}}>Workflow</p>
          <p style={{fontSize:11.5,color:CO.muted,lineHeight:1.6}}>1. Import data<br/>2. Review tabs<br/>3. <strong style={{color:CO.accent}}>Generate report</strong></p></div>
      </nav>
      <main style={{flex:1,padding:28,overflow:"auto"}}>
        {totalExcluded>0&&tab!=="import"&&<div style={{marginBottom:16,padding:"10px 16px",borderRadius:10,background:`${CO.yellow}0e`,border:`1px solid ${CO.yellow}35`,fontSize:12,color:CO.muted}}>
          <strong style={{color:CO.yellow}}>{totalExcluded.toLocaleString()} records</strong> fall outside {ay} and are excluded from every figure below.{preSummerAvailable&&!inclPreSummer?` ${preSummerCount.toLocaleString()} of them are ${suPre} — use the toggle above to include that term.`:""}
        </div>}
        {tab==="import"&&<ImportTab cacheMode={cacheMode} rawData={rawData} setRawData={setRawData} testRoomData={testRoomData} setTestRoomData={setTestRoomData} testAccomData={testAccomData} setTestAccomData={setTestAccomData} apptData={apptData} setApptData={setApptData} caseNotesData={caseNotesData} setCaseNotesData={setCaseNotesData} studentNotesData={studentNotesData} setStudentNotesData={setStudentNotesData} incomingData={incomingData} setIncomingData={setIncomingData} iSt={iSt} setISt={setISt} ld={ld} setLd={setLd} onClearAll={()=>{if(!window.confirm("Clear all cached data? You will need to re-import your files."))return;[setRawData,setTestRoomData,setTestAccomData,setApptData,setCaseNotesData,setStudentNotesData,setIncomingData].forEach(fn=>fn([]));Object.keys(SETTERS).forEach(k=>{idbDel(k).catch(()=>{});try{localStorage.removeItem(LS_KEYS[k])}catch(e){}});setISt({});}}/>}
        {tab==="summary"&&<ExecTab execStats={execStats} TERMS={TERMS} fS={fS} sS={sS} hasTest={bookS.rows.length>0} hasAppt={apptS.rows.length>0} hasNotes={cnS.rows.length>0||snS.rows.length>0} hasIncoming={incomingData.length>0}/>}
        {tab==="academic"&&<AcadTab rawData={rawF} census={acadS.census} T={T} TERMS={TERMS}/>}
        {tab==="housing"&&<HousingTab rawData={rawF} census={acadS.census} T={T} TERMS={TERMS}/>}
        {tab==="testroom"&&<TestTab testRoomData={bookS.rows} bookCensus={bookS.census} testAccomData={testAccomF} accomCensus={taS.census} T={T} TERMS={TERMS}/>}
        {tab==="appointments"&&<DirectServicesTab apptData={apptS.rows} census={apptS.census} T={T} TERMS={TERMS}/>}
        {tab==="indirect"&&<IndirectContactsTab caseNotesData={cnS.rows} studentNotesData={snS.rows} census={{...cnS.census}} census2={{...snS.census}} T={T} TERMS={TERMS}/>}
        {tab==="incoming"&&<IncomingTab incomingData={incomingData} T={T} TERMS={TERMS}/>}
        {tab==="students"&&<StudTab rawData={rawF} testRoomData={bookS.rows} testAccomData={testAccomF} apptData={apptData} incomingData={incomingData} T={T} TERMS={TERMS}/>}
        {tab==="export"&&<ExpTab rawData={rawF} T={T} TERMS={TERMS}/>}
        {tab==="generate"&&<GenReportTab rawData={rawF} testRoomData={bookS.rows} testAccomData={testAccomF} apptData={apptS.rows} caseNotesData={cnS.rows} studentNotesData={snS.rows} incomingData={incomingData} T={T} TERMS={TERMS} fS={fS} sS={sS} suS={suS} academicYear={ay}/>}
      </main></div></div>);
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
