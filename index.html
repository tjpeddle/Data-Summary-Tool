<script type="text/babel">
const{useState,useMemo,useRef,useEffect}=React;

/* ═══ UTILITIES ═══ */
function parseCSV(t){const l=t.split(/\r?\n/).filter(l=>l.trim());if(!l.length)return[];const h=ssplit(l[0]);return l.slice(1).map(line=>{const v=ssplit(line),o={};h.forEach((hh,i)=>(o[hh.trim()]=(v[i]||"").trim()));return o})}
function ssplit(l){const r=[];let c="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"')q=!q;else if(ch===","&&!q){r.push(c);c=""}else c+=ch}r.push(c);return r}
async function parseExcel(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true,dateNF:"yyyy-mm-dd"});res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:false}))}catch(err){rej(err)}};r.onerror=rej;r.readAsArrayBuffer(f)})}
async function parseFile(f){if(f.name.endsWith(".csv"))return parseCSV(await f.text());return parseExcel(f)}
/* ═══════════════════════════════════════════════════════════════════
   PERSISTENCE — localStorage caps at about 5 MB, which the Academic &
   Housing (326k rows) and Case Notes (31k rows) exports blow straight
   past, so they silently vanished on reload. IndexedDB has a far larger
   quota and stores structured objects directly (no JSON round-trip).
   Falls back to localStorage where IndexedDB is unavailable.
   ═══════════════════════════════════════════════════════════════════ */
const IDB_NAME="oars_db",IDB_STORE="datasets";
function idbOpen(){return new Promise((res,rej)=>{
  let r;try{r=indexedDB.open(IDB_NAME,1)}catch(e){return rej(e)}
  r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error("indexedDB open failed"));
  r.onblocked=()=>rej(new Error("indexedDB blocked"));
  setTimeout(()=>rej(new Error("indexedDB timeout")),6000);
})}
function idbSet(k,v){return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).put(v,k);
  tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error("aborted"));
}))}
function idbGet(k){return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,"readonly");const q=tx.objectStore(IDB_STORE).get(k);
  q.onsuccess=()=>res(q.result==null?null:q.result);q.onerror=()=>rej(q.error);
}))}
function idbDel(k){return idbOpen().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).delete(k);
  tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);
}))}
function idbAvailable(){
  return idbOpen().then(db=>{try{db.close()}catch(e){}return true}).catch(()=>false);
}

function dlXLSX(rows,fn){if(!rows.length)return;const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Report");XLSX.writeFile(wb,fn)}

const CO={bg:"#0a0e1a",card:"#111630",border:"#1e2542",accent:"#3878ff",accentSoft:"#3878ff18",green:"#22c58d",red:"#ef5757",yellow:"#f0b429",orange:"#f08c3a",purple:"#8b6cff",text:"#e2e6f0",muted:"#7a84a6",dim:"#4a5272"};
const UG=["Freshman","Sophomore","Junior","Senior"];
const PALETTES={
  Default:["#22c58d","#ef5757","#3878ff","#8b6cff","#f0b429","#f08c3a","#e05db0","#5cc9f5","#a3e048","#ff6b8a","#45d0e0","#ffb347"],
  Professional:["#2563eb","#dc2626","#059669","#d97706","#7c3aed","#db2777","#0891b2","#65a30d","#c2410c","#4f46e5","#0d9488","#a21caf"],
  Soft:["#93c5fd","#fca5a5","#86efac","#fde68a","#c4b5fd","#fbcfe8","#99f6e4","#fef08a","#fed7aa","#a5b4fc","#a7f3d0","#f9a8d4"],
  Warm:["#f97316","#ef4444","#eab308","#f59e0b","#dc2626","#fb923c","#fbbf24","#d97706","#c2410c","#ea580c","#ca8a04","#b91c1c"],
  Cool:["#3b82f6","#06b6d4","#8b5cf6","#6366f1","#0ea5e9","#14b8a6","#a78bfa","#2dd4bf","#818cf8","#22d3ee","#7c3aed","#0891b2"],
  Earth:["#92400e","#166534","#854d0e","#1e3a5f","#7c2d12","#365314","#78350f","#1e40af","#9a3412","#15803d","#a16207","#1d4ed8"],
};

function normCL(cl){if(!cl)return"";const l=cl.trim().toLowerCase();if(l.includes("fresh"))return"Freshman";if(l.includes("soph"))return"Sophomore";if(l.includes("jun"))return"Junior";if(l.includes("sen"))return"Senior";if(l.includes("grad")&&!l.includes("incoming"))return"Graduate";if(l.includes("doct"))return"Doctoral";if(l.includes("alum"))return"Alumni";if(l.includes("exchange"))return"Exchange Program";if(l.includes("incoming"))return"Incominggr";return cl.trim()}
function isH(a){if(!a)return false;const l=a.toLowerCase();return l.includes("housing accommodation")||l.includes("emotional support animal")||l.includes("service animal")||l.includes("accessible transportation")}
function isA(a){return a&&!isH(a)}
function cHN(n){return n?(n.replace(/Housing Accommodation\/?/gi,"").replace(/^\//,"").trim()||n):""}

/* ═══════════════════════════════════════════════════════════════════
   TERM RESOLUTION — handles BOTH file shapes:
     (a) files with a literal semester label ("Summer 2026")
         → Academic & Housing, Testing Accommodations, Test Room Bookings
     (b) files with only a raw date ("2026-06-22", 6/22/2026, Date object)
         → Direct Service Appointments, Case Notes, Student Notes
   Both resolve to the same canonical string, e.g. "Summer 2026",
   so every tab can compare against one set of term names.
   ═══════════════════════════════════════════════════════════════════ */

// Month → term. Summer = June + July, so a 7/31 cutoff is fully captured.
const SUMMER_MO=[6,7], WINTER_MO=[], FALL_MO=[8,9,10,11,12];
function pDate(d){
  if(d===null||d===undefined||d===""||d==="Invalid Date")return null;
  if(d instanceof Date)return isNaN(d)?null:{mo:d.getMonth()+1,yr:d.getFullYear()};
  const s=String(d).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);        // 2026-06-22 or 2025-09-02 11:00:19
  if(m)return{mo:parseInt(m[2],10),yr:parseInt(m[1],10)};
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);          // 6/22/2026
  if(m)return{mo:parseInt(m[1],10),yr:parseInt(m[3],10)};
  const dt=new Date(s);
  return isNaN(dt)?null:{mo:dt.getMonth()+1,yr:dt.getFullYear()};
}
// Derive a term from a date.
function semOf(d){
  const p=pDate(d);if(!p)return"Unknown";
  if(SUMMER_MO.includes(p.mo))return`Summer ${p.yr}`;
  if(FALL_MO.includes(p.mo))return`Fall ${p.yr}`;
  return`Spring ${p.yr}`;
}
// Resolve ANY semester cell — label or date — to a canonical term string.
function normTerm(v){
  if(v===null||v===undefined||v==="")return"Unknown";
  if(v instanceof Date)return semOf(v);
  const s=String(v).trim();
  if(!s)return"Unknown";
  const m=s.match(/^(fall|winter|spring|summer|fa|wi|sp|su)\w*\s*[-,/ ]?\s*(\d{4})$/i);
  if(m){
    const w=m[1].toLowerCase();
    const term=w.startsWith("fa")?"Fall":w.startsWith("wi")?"Winter":w.startsWith("sp")?"Spring":"Summer";
    return`${term} ${m[2]}`;
  }
  const asDate=semOf(s);
  return asDate==="Unknown"?s:asDate;
}

/* Build accommodation summary, driven entirely by the TERMS array. */
function bSum(data,TERMS,cFn){
  const KEY={};TERMS.forEach(t=>KEY[t.label]=t.key);
  const acc={};data.forEach(r=>{const raw=r["Requested Accommodation"]||"";const a=cFn?cFn(raw):raw;const st=(r["Approved"]||"").toLowerCase();const sem=normTerm(r["Semester (course)"]);const sid=r["Student ID"]||r["Name"];if(!a)return;
    if(!acc[a]){acc[a]={name:a,tot:new Set(),yA:new Set(),yD:new Set(),t:{}};TERMS.forEach(t=>acc[a].t[t.key]={A:new Set(),D:new Set()});}
    const x=acc[a];x.tot.add(sid);
    const k=KEY[sem];
    if(k){if(st==="approved")x.t[k].A.add(sid);else if(st==="denied")x.t[k].D.add(sid)}
    if(st==="approved")x.yA.add(sid);else if(st==="denied")x.yD.add(sid)});
  return Object.values(acc).map(a=>{
    const o={name:a.name,totalUnique:a.tot.size,calApproved:a.yA.size,calDenied:a.yD.size};
    TERMS.forEach(t=>{o[t.key+"Approved"]=a.t[t.key].A.size;o[t.key+"Denied"]=a.t[t.key].D.size});
    return o;
  }).sort((a,b)=>b.totalUnique-a.totalUnique);
}

/* Enrolled flag — files that carry an "Enrolled" column mark each course row Yes/No. */
function hasEnrolledCol(rows){return rows.length>0&&Object.keys(rows[0]).some(k=>k.trim().toLowerCase()==="enrolled")}
function isEnrolled(r){const v=r["Enrolled"];return v===undefined||v===null||v===""?true:String(v).trim().toLowerCase()!=="no"}
function applyEnrolled(rows,on){return(on&&hasEnrolledCol(rows))?rows.filter(isEnrolled):rows}

/* Which terms actually appear in a dataset — so nothing is silently dropped. */
function termCensus(rows,field){
  const c={};rows.forEach(r=>{const t=normTerm(r[field]);c[t]=(c[t]||0)+1});return c;
}

/* ═══════════════════════════════════════════════════════════════════
   SCOPING — restrict a dataset to the selected academic year's terms.
   Every headline total is computed from the scoped rows, so the term
   columns always sum to the total. Rows outside the year are not
   discarded silently: they come back in `census` for the coverage strip.
   getTerm(r) returns the canonical term for one row.
   ═══════════════════════════════════════════════════════════════════ */
function scopeRows(rows,getTerm,TERMS){
  const keep=new Set(TERMS.map(t=>t.label));
  const census={};const inScope=[];
  rows.forEach(r=>{
    const t=getTerm(r);
    census[t]=(census[t]||0)+1;
    if(keep.has(t))inScope.push(r._term===t?r:{...r,_term:t});
  });
  const out=Object.entries(census).filter(([k])=>!keep.has(k)).reduce((a,[,v])=>a+v,0);
  return{rows:inScope,census,outOfScope:out};
}

function renderChartToPNG(type,data,options,width,height){
  return new Promise((resolve)=>{
    const area=document.getElementById('chart-render-area');const canvas=document.createElement('canvas');
    canvas.width=width;canvas.height=height;area.appendChild(canvas);
    const defaults={responsive:false,animation:false,plugins:{legend:{labels:{color:"#333",font:{family:"Arial",size:13,weight:'bold'},padding:14}},tooltip:{enabled:false}},scales:type==='pie'||type==='doughnut'?{}:{x:{ticks:{color:"#444",font:{family:"Arial",size:12}},grid:{color:"#ddd"}},y:{ticks:{color:"#444",font:{family:"Arial",size:12}},grid:{color:"#ddd"}}}};
    const merged={...defaults,...options,plugins:{...defaults.plugins,...(options?.plugins||{})}};
    const chart=new Chart(canvas.getContext('2d'),{type,data,options:merged});
    setTimeout(()=>{const b64=canvas.toDataURL('image/png').split(',')[1];chart.destroy();area.removeChild(canvas);resolve(b64)},350);
  });
}

function PChart({type,data,options,height=260}){
  const ref=useRef();const ch=useRef();
  useEffect(()=>{if(ch.current)ch.current.destroy();
    const dO={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:CO.muted,font:{family:"'Outfit'",size:12},padding:14}},tooltip:{backgroundColor:"#1a2248",titleColor:CO.text,bodyColor:CO.muted,cornerRadius:8,padding:12}},scales:type==='pie'||type==='doughnut'?{}:{x:{ticks:{color:CO.dim,font:{family:"'Outfit'",size:11}},grid:{color:"#1a2040"}},y:{ticks:{color:CO.dim,font:{family:"'Outfit'",size:11}},grid:{color:"#1a2040"}}}};
    const m={...dO,...options,plugins:{...dO.plugins,...(options?.plugins||{})}};
    ch.current=new Chart(ref.current.getContext('2d'),{type,data,options:m});
    return()=>{if(ch.current)ch.current.destroy()};
  },[type,JSON.stringify(data),JSON.stringify(options)]);
  return <div style={{position:"relative",height}}><canvas ref={ref}/></div>;
}

function SC({label,value,sub,color=CO.accent,icon}){
  return(<div className="stat-card" style={{background:CO.card,borderRadius:14,border:`1px solid ${CO.border}`,padding:"20px 24px"}}>
    <p style={{fontSize:11.5,color:"#b0b8d8",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8,fontWeight:600}}>{label}</p>
    <p style={{fontSize:30,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color,lineHeight:1}}>{typeof value==="number"?value.toLocaleString():value}</p>
    {sub&&<p style={{fontSize:12,color:CO.muted,marginTop:6}}>{sub}</p>}</div>);
}
function Empty({msg}){return<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:400,opacity:.5}}><p style={{fontSize:16,color:CO.muted}}>{msg||"No data loaded. Import data first."}</p></div>}

/* ═══ SUMMARY PANEL ═══ */
function SummaryPanel({panel,onClose,TERMS=[]}){
  const open=!!panel;
  if(!panel)return(<><div className="panel-overlay"/><div className="side-panel"/></>);
  const {title,type,row,testRoomData,rawData,allStudents}=panel;
  const terms=panel.TERMS||TERMS;

  // Build stats depending on panel type
  let content=null;
  if(type==="accommodation"&&row){
    const total=row.calApproved+row.calDenied;
    const pctA=total?((row.calApproved/total)*100).toFixed(1):"0";
    const pctD=total?((row.calDenied/total)*100).toFixed(1):"0";
    content=(<>
      <div style={{marginBottom:20}}>
        <p style={{fontSize:12,color:CO.dim,textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}}>Accommodation</p>
        <p style={{fontSize:15,fontWeight:700,color:CO.text,lineHeight:1.4}}>{row.name}</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
        <div className="stat-mini"><p style={{fontSize:11,color:CO.muted,marginBottom:4}}>Unique Students</p><p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.accent}}>{row.totalUnique.toLocaleString()}</p></div>
        <div className="stat-mini"><p style={{fontSize:11,color:CO.muted,marginBottom:4}}>Total Records</p><p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.purple}}>{total.toLocaleString()}</p></div>
        <div className="stat-mini"><p style={{fontSize:11,color:CO.muted,marginBottom:4}}>Approved</p><p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.green}}>{row.calApproved.toLocaleString()}</p><p style={{fontSize:11,color:CO.muted,marginTop:2}}>{pctA}% of total</p></div>
        <div className="stat-mini"><p style={{fontSize:11,color:CO.muted,marginBottom:4}}>Denied</p><p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.red}}>{row.calDenied.toLocaleString()}</p><p style={{fontSize:11,color:CO.muted,marginTop:2}}>{pctD}% of total</p></div>
      </div>
      <div style={{background:CO.bg,borderRadius:10,border:`1px solid ${CO.border}`,overflow:"hidden"}}>
        <table style={{width:"100%"}}>
          <thead><tr><th>Semester</th><th style={{textAlign:"right"}}>Approved</th><th style={{textAlign:"right"}}>Denied</th><th style={{textAlign:"right"}}>Unique</th></tr></thead>
          <tbody>
            {terms.map(t=>(<tr key={t.label}><td style={{fontWeight:500,color:t.col}}>{t.label}</td><td style={{textAlign:"right"}}><span className="badge badge-green">{row[t.key+"Approved"]||0}</span></td><td style={{textAlign:"right"}}><span className="badge badge-red">{row[t.key+"Denied"]||0}</span></td><td style={{textAlign:"right",fontWeight:700}}>{((row[t.key+"Approved"]||0)+(row[t.key+"Denied"]||0)).toLocaleString()}</td></tr>))}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:16,padding:12,borderRadius:10,background:`${CO.accent}10`,border:`1px solid ${CO.accent}30`}}>
        <p style={{fontSize:12,color:CO.muted,lineHeight:1.7}}>
          <strong style={{color:CO.accent}}>{row.totalUnique.toLocaleString()} students</strong> qualified for this accommodation.<br/>
          Approval rate: <strong style={{color:CO.green}}>{pctA}%</strong> &nbsp;|&nbsp; Denial rate: <strong style={{color:CO.red}}>{pctD}%</strong>
        </p>
      </div>
    </>);
  } else if(type==="testroom"&&testRoomData){
    const total=testRoomData.length;
    const termRows=terms.map(t=>{const n=testRoomData.filter(r=>(r._term||normTerm(r["Semester"]))===t.label).length;return{...t,n}});
    const unique=new Set(testRoomData.map(r=>r["Student"])).size;
    const cancelled=testRoomData.filter(r=>(r["Appointment Cancelled"]||"").toLowerCase()==="yes").length;
    content=(<>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
        <div className="stat-mini"><p style={{fontSize:11,color:CO.muted,marginBottom:4}}>Total Bookings</p><p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.yellow}}>{total.toLocaleString()}</p></div>
        <div className="stat-mini"><p style={{fontSize:11,color:CO.muted,marginBottom:4}}>Unique Students</p><p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.accent}}>{unique.toLocaleString()}</p></div>
        <div className="stat-mini"><p style={{fontSize:11,color:CO.muted,marginBottom:4}}>Cancelled</p><p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.red}}>{cancelled.toLocaleString()}</p><p style={{fontSize:11,color:CO.muted,marginTop:2}}>{total?((cancelled/total)*100).toFixed(1):0}% of bookings</p></div>
        <div className="stat-mini"><p style={{fontSize:11,color:CO.muted,marginBottom:4}}>Attended</p><p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.green}}>{(total-cancelled).toLocaleString()}</p></div>
      </div>
      <div style={{background:CO.bg,borderRadius:10,border:`1px solid ${CO.border}`,overflow:"hidden"}}>
        <table style={{width:"100%"}}>
          <thead><tr><th>Semester</th><th style={{textAlign:"right"}}>Bookings</th><th style={{textAlign:"right"}}>% of Total</th></tr></thead>
          <tbody>
            {termRows.map(t=>(<tr key={t.label}><td style={{fontWeight:500,color:t.col}}>{t.label}</td><td style={{textAlign:"right",fontWeight:700}}>{t.n.toLocaleString()}</td><td style={{textAlign:"right",color:t.col}}>{total?((t.n/total)*100).toFixed(1):0}%</td></tr>))}
          </tbody>
        </table>
      </div>
    </>);
  } else if(type==="students"&&allStudents){
    const{all,byTerm,tot}=allStudents;
    const lvls=Object.keys(all).sort((a,b)=>all[b]-all[a]);
    content=(<>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
        <div className="stat-mini" style={{gridColumn:"span 2"}}><p style={{fontSize:11,color:CO.muted,marginBottom:4}}>Total Unique Students</p><p style={{fontSize:32,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.accent}}>{tot(all).toLocaleString()}</p></div>
        {terms.map(t=><div key={t.label} className="stat-mini"><p style={{fontSize:11,color:CO.muted,marginBottom:4}}>{t.label}</p><p style={{fontSize:22,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:t.col}}>{tot(byTerm[t.label]||{}).toLocaleString()}</p></div>)}
      </div>
      <div style={{background:CO.bg,borderRadius:10,border:`1px solid ${CO.border}`,overflow:"hidden",maxHeight:320,overflowY:"auto"}}>
        <table style={{width:"100%"}}>
          <thead><tr><th>Class Level</th>{terms.map(t=><th key={t.label} style={{textAlign:"right",color:t.col}}>{shortTerm(t.label,terms)}</th>)}<th style={{textAlign:"right"}}>Total</th></tr></thead>
          <tbody>{lvls.map(cl=><tr key={cl}><td style={{fontWeight:500}}>{cl}</td>{terms.map(t=><td key={t.label} style={{textAlign:"right"}}>{((byTerm[t.label]||{})[cl]||0).toLocaleString()}</td>)}<td style={{textAlign:"right",fontWeight:700,color:CO.accent}}>{(all[cl]||0).toLocaleString()}</td></tr>)}</tbody>
        </table>
      </div>
    </>);
  }

  return(<>
    <div className={`panel-overlay${open?" open":""}`} onClick={onClose}/>
    <div className={`side-panel${open?" open":""}`}>
      <div style={{padding:"20px 24px",borderBottom:`1px solid ${CO.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        <div>
          <p style={{fontSize:11,color:CO.dim,textTransform:"uppercase",letterSpacing:".06em",marginBottom:3}}>Summary</p>
          <h3 style={{fontSize:16,fontWeight:700}}>{title}</h3>
        </div>
        <button onClick={onClose} style={{background:"transparent",border:`1.5px solid ${CO.border}`,borderRadius:8,color:CO.muted,cursor:"pointer",padding:"6px 12px",fontSize:14,fontFamily:"inherit"}}>✕ Close</button>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"20px 24px"}}>
        {content}
      </div>
    </div>
  </>);
}

/* ═══ IMPORT TAB ═══ */
function ImportTab({cacheMode,rawData,setRawData,testRoomData,setTestRoomData,testAccomData,setTestAccomData,apptData,setApptData,caseNotesData,setCaseNotesData,studentNotesData,setStudentNotesData,incomingData,setIncomingData,iSt,setISt,ld,setLd,onClearAll}){
  const rR=useRef(),tR=useRef(),taR=useRef(),aR=useRef(),cnR=useRef(),snR=useRef(),inR=useRef();
  const handle=async(e,type)=>{const file=e.target.files[0];if(!file)return;setLd(true);try{
    // Special handling for incoming — duplicate "Approved" headers collapse in XLSX.js
    if(type==="incoming"){
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellDates:false,raw:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
      // Col 0=Name,1=StudentID,2=RequestedAccom,3=ClassLevel,4=ApprovedDate,5=ApprovedStatus
      const finalData=rows.slice(1).filter(r=>String(r[0]||"").trim()).map(r=>({
        "Name":String(r[0]||"").trim(),
        "Student ID":String(r[1]||"").trim(),
        "Requested Accommodation":String(r[2]||"").trim(),
        "Class Level":String(r[3]||"").trim(),
        "_ApprovedDate":String(r[4]||"").trim(),
        "_ApprovedStatus":String(r[5]||"").trim(),
        "Created":String(r[6]||"").trim(),
        "Request #":String(r[7]||"").trim(),
      }));
      setIncomingData(finalData);
      setISt(s=>({...s,incoming:{ok:true,ct:finalData.length,fn:file.name}}));
      setLd(false);return;
    }
    const data=await parseFile(file);
    const norm=data.map(row=>{const r={};Object.keys(row).forEach(k=>{r[k.trim()]=typeof row[k]==="string"?row[k].trim():String(row[k]??'').trim()});return r});
    const filtered=norm.filter(r=>{
      if(type==="test")return r["Student"];
      if(type==="appt")return r["Symplicity Student ID"]||r["Student ID"];
      if(type==="casenotes")return r["Symplicity Student ID"]||r["Name of Specialist"];
      if(type==="studentnotes")return r["Symplicity Student ID"]||r["Created By (Student)"];
      return r["Name"]||r["Student ID"];
    });
    const finalData=filtered;
    if(type==="raw")setRawData(finalData);
    else if(type==="test")setTestRoomData(finalData);
    else if(type==="testaccom")setTestAccomData(finalData);
    else if(type==="appt")setApptData(finalData);
    else if(type==="casenotes")setCaseNotesData(finalData);
    else if(type==="studentnotes")setStudentNotesData(finalData);
    setISt(s=>({...s,[type]:{ok:true,ct:finalData.length,fn:file.name}}));}catch(err){setISt(s=>({...s,[type]:{ok:false,err:err.message}}))}setLd(false)};
  const slots=[
    {t:"raw",ref:rR,col:CO.accent,icon:"◎",title:"Academic & Housing Accommodations",cols:"Name, Student ID, Class Level, Requested Accommodation, Approved, Semester (course)"},
    {t:"testaccom",ref:taR,col:CO.orange,icon:"✎",title:"Testing Accommodations",cols:"Name, Student ID, Class Level, Requested Accommodation, Approved, Semester (course)"},
    {t:"test",ref:tR,col:CO.purple,icon:"📋",title:"Test Room Bookings",cols:"Student, Course (Object), Exam, Appointment Cancelled, Semester"},
    {t:"appt",ref:aR,col:"#22c5c5",icon:"🤝",title:"Direct Service Appointments",cols:"Symplicity Student ID, Appointment Type, AppointmentDate, Appointment Length, Staff, Appointment Cancelled"},
    {t:"casenotes",ref:cnR,col:"#c57a22",icon:"📝",title:"Case Notes (Indirect Contacts)",cols:"Name of Specialist, Category (Case), Symplicity Student ID, Duration (Case), Created"},
    {t:"studentnotes",ref:snR,col:"#c522a0",icon:"🗒️",title:"Student Notes (Indirect Contacts)",cols:"Symplicity Student ID, Category (Student), Date Created (Student), Created By (Student), Duration (Student)"},
    {t:"incoming",ref:inR,col:"#e6b94a",icon:"🎓",title:"New Student Registrations",cols:"Name, Student ID, Requested Accommodation, Class Level, Approved (date), Approved (status)"},
  ];
  return(<div className="fade-up">
    {cacheMode==="loading"&&<div style={{marginBottom:12,padding:"10px 16px",borderRadius:10,background:`${CO.accent}0e`,border:`1px solid ${CO.accent}30`,fontSize:12,color:CO.muted}}>Restoring previously imported data&hellip;</div>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><h2 style={{fontSize:26,fontWeight:800}}>Import Your Data</h2><button onClick={onClearAll} style={{fontSize:12,padding:"6px 14px",borderRadius:8,background:"#2a1520",border:"1px solid #ef575760",color:CO.red,cursor:"pointer",fontWeight:600}}>🗑 Clear All Saved Data</button></div>
    <p style={{color:CO.muted,marginBottom:28}}>Upload .xlsx, .xlsm, .xls, or .csv files. Load all files for full reporting.</p>
    {(rawData.length||testRoomData.length||testAccomData.length||apptData.length||caseNotesData.length||studentNotesData.length||incomingData.length)?<div style={{marginBottom:16,padding:"14px 18px",borderRadius:12,background:"#0d1f0d",border:"1.5px solid #22c58d50",display:"flex",alignItems:"flex-start",gap:12}}>
      <span style={{fontSize:22,marginTop:1}}>💾</span>
      <div style={{flex:1}}>
        <p style={{fontSize:13,fontWeight:700,color:CO.green,marginBottom:6}}>Previous session data restored{cacheMode==="idb"?" from IndexedDB":cacheMode==="local"?" from localStorage":""}</p>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {[
            {label:"Academic/Housing",val:rawData.length,key:"raw"},
            {label:"Exam Bookings",val:testRoomData.length,key:"test"},
            {label:"Testing Accom.",val:testAccomData.length,key:"testAccom"},
            {label:"Appointments",val:apptData.length,key:"appt"},
            {label:"Case Notes",val:caseNotesData.length,key:"caseNotes"},
            {label:"Student Notes",val:studentNotesData.length,key:"studentNotes"},
            {label:"Incoming",val:incomingData.length,key:"incoming"},
          ].map(({label,val,key})=>val
            ?<span key={key} style={{fontSize:11,padding:"3px 10px",borderRadius:20,background:"#22c58d20",border:"1px solid #22c58d40",color:CO.green,fontWeight:600}}>✓ {label}: {val.toLocaleString()}</span>
            :<span key={key} style={{fontSize:11,padding:"3px 10px",borderRadius:20,background:"#ef575715",border:"1px solid #ef575730",color:"#ef7a7a"}}>⚠ {label}: needs re-import</span>
          )}
        </div>
        <p style={{fontSize:10.5,color:CO.dim,marginTop:6}}>{cacheMode==="idb"
          ?"Stored in this browser's IndexedDB — large files (Academic/Housing, Case Notes) persist between sessions."
          :"This browser fell back to localStorage (about 5 MB), so large files may not survive a reload — re-import any marked above."}</p>
      </div>
    </div>:null}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,maxWidth:1100}}>
      {slots.map(c=>(<div key={c.t} style={{background:CO.card,borderRadius:14,border:`1.5px solid ${iSt[c.t]?.ok?c.col+"66":CO.border}`,padding:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div style={{width:30,height:30,borderRadius:8,background:`${c.col}20`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>{c.icon}</div>
          <h3 style={{fontSize:13,fontWeight:700,lineHeight:1.3}}>{c.title}</h3>
        </div>
        <p style={{fontSize:10.5,color:CO.muted,marginBottom:12,lineHeight:1.5}}>Columns: <strong style={{color:CO.text}}>{c.cols}</strong></p>
        <input ref={c.ref} type="file" accept=".csv,.xlsx,.xlsm,.xls" onChange={e=>handle(e,c.t)}/>
        <button className="btn btn-primary" onClick={()=>c.ref.current.click()} style={{width:"100%",background:c.col,fontSize:12,padding:"8px 14px"}}>{ld?"Processing…":"Choose File & Import"}</button>
        {iSt[c.t]&&<div style={{marginTop:10,padding:8,borderRadius:8,background:iSt[c.t].ok?`${CO.green}12`:`${CO.red}12`,fontSize:11}}>
          {iSt[c.t].ok?<span style={{color:CO.green}}>✓ {iSt[c.t].ct.toLocaleString()} records — {iSt[c.t].fn}</span>:<span style={{color:CO.red}}>✗ {iSt[c.t].err}</span>}</div>}
      </div>))}
    </div>
    {rawData.length>0&&<div style={{marginTop:24,background:CO.card,borderRadius:14,border:`1px solid ${CO.border}`,padding:18}}>
      <h3 style={{fontSize:13,fontWeight:600,marginBottom:8}}>Preview — Academic & Housing (first 8 rows)</h3>
      <div style={{overflow:"auto",maxHeight:220}}><table><thead><tr>{Object.keys(rawData[0]).slice(0,7).map(h=><th key={h}>{h}</th>)}</tr></thead>
      <tbody>{rawData.slice(0,8).map((r,i)=><tr key={i}>{Object.keys(rawData[0]).slice(0,7).map(h=><td key={h}>{r[h]}</td>)}</tr>)}</tbody></table></div></div>}
  </div>);
}

function ExecTab({execStats,TERMS=[],fS,sS,hasTest,hasAppt,hasNotes,hasIncoming,testRoomLen}){
  if(!execStats)return<Empty msg="Import the Academic & Housing Accommodations file to view the Executive Summary."/>;
  const{uniqueStudents,approvedStudents,deniedOnly,acadArr,housArr,testBooked,testDelivered,testCancelled,fallTests,springTests,summerTests,testsByTerm={},apptTermRows=[],testAccomApproved,apptCount,apptHrs,notesCount,notesHrs,inTotal,inApproved}=execStats;
  const approvalRate=uniqueStudents?((approvedStudents/uniqueStudents)*100).toFixed(1):0;
  const testCancelRate=testBooked?((testCancelled/testBooked)*100).toFixed(1):0;
  const combinedHrs=(apptHrs&&notesHrs)?(parseFloat(apptHrs)+parseFloat(notesHrs)).toFixed(1):null;
  const top5Acad=acadArr.slice(0,5);
  const top3Hous=housArr.slice(0,3);
  const leastAcad=acadArr.length?acadArr[acadArr.length-1]:null;
  const leastHous=housArr.length?housArr[housArr.length-1]:null;
  const acadChartData={labels:top5Acad.map(r=>r.name.length>28?r.name.slice(0,26)+"…":r.name),datasets:[{label:"Approved",data:top5Acad.map(r=>r.approved),backgroundColor:`${CO.green}cc`,borderRadius:4},{label:"Denied",data:top5Acad.map(r=>r.denied),backgroundColor:`${CO.red}88`,borderRadius:4}]};
  const acadChartOpts={indexAxis:"y",responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{color:CO.muted,font:{size:11}}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.x.toLocaleString()}`}}},scales:{x:{grid:{color:CO.border},ticks:{color:CO.muted,font:{size:11}}},y:{grid:{display:false},ticks:{color:CO.text,font:{size:10}}}}};
  const chartTerms=TERMS.filter(t=>testsByTerm[t.label]);
  const testChartData={labels:[...chartTerms.map(t=>t.label),"Grand Total"],datasets:[{label:"Exams",data:[...chartTerms.map(t=>testsByTerm[t.label]),testDelivered],backgroundColor:[...chartTerms.map(t=>t.col+"cc"),`${CO.purple}cc`],borderRadius:6}]};
  const testChartOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.parsed.y.toLocaleString()} exams`}}},scales:{x:{grid:{display:false},ticks:{color:CO.muted}},y:{grid:{color:CO.border},ticks:{color:CO.muted}}}};
  const Div=({label})=>(<div style={{display:"flex",alignItems:"center",gap:12,margin:"18px 0 12px"}}><div style={{height:1,flex:1,background:CO.border}}/><span style={{fontSize:11,color:CO.dim,fontWeight:600,textTransform:"uppercase",letterSpacing:".08em",whiteSpace:"nowrap"}}>{label}</span><div style={{height:1,flex:1,background:CO.border}}/></div>);

    <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:4}}>
      <h2 style={{fontSize:26,fontWeight:800}}>Executive Summary</h2>
      <span style={{fontSize:12,color:CO.dim,fontFamily:"'JetBrains Mono',monospace"}}>{TERMS.length?`${TERMS[0].label} — ${TERMS[TERMS.length-1].label}`:`${fS} — ${sS}`}</span>
    </div>
    <p style={{fontSize:13,color:CO.muted,marginBottom:14}}>Auto-updates when new files are imported.</p>
    <Div label="Student Population"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:8}}>
      <SC label="Total Unique Students" value={uniqueStudents} color={CO.accent}/>
      <SC label="At Least One Approved" value={approvedStudents} color={CO.green} sub={`${approvalRate}% approval rate`}/>
      <SC label="Denied All" value={deniedOnly} color={CO.red}/>
      <SC label="Total Records" value={execStats.acadArr.reduce((a,r)=>a+r.approved+r.denied,0)+execStats.housArr.reduce((a,r)=>a+r.approved+r.denied,0)} color={CO.purple}/>
    </div>
    {hasTest&&<><Div label="Testing Center"/>
      <div style={{display:"grid",gridTemplateColumns:`repeat(${3+TERMS.length},1fr)`,gap:14,marginBottom:10}}>
        <SC label="Total Booked" value={testBooked} color={CO.accent}/>
        <SC label="Delivered" value={testDelivered} color={CO.green}/>
        <SC label="Cancelled" value={testCancelled} color={CO.red} sub={`${testCancelRate}% rate`}/>
        {TERMS.map(t=><SC key={t.label} label={t.label} value={testsByTerm[t.label]||0} color={t.col}/>)}
      </div>
      {testAccomApproved!=null&&<div style={{padding:"10px 16px",borderRadius:10,background:`${CO.orange}18`,border:`1.5px solid ${CO.orange}60`,marginBottom:8,fontSize:14,fontWeight:600,color:CO.text}}>✎ <strong style={{color:CO.orange,fontSize:16}}>{testAccomApproved.toLocaleString()}</strong> unique students approved for testing accommodations</div>}
    </>}
    {(hasAppt||hasNotes)&&<><Div label="Direct & Indirect Service"/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:8}}>
        <SC label="Direct Appts Delivered" value={hasAppt?apptCount:"—"} color={"#22c5c5"}/>

        <SC label="Interacted with OARS" value={inTotal} color={"#e6b94a"}/>

    </>}

        <p style={{fontSize:12,fontWeight:700,color:CO.orange,textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>✎ Testing Center — Exams by Semester</p>

      <div style={{background:CO.card,borderRadius:14,border:`1px solid ${CO.border}`,padding:18}}>

/* Short column header. "Fall 2025" → "Fall"; but when two terms share a season
   (Summer 2025 and Summer 2026 both present) the year is kept to disambiguate. */
function shortTerm(l,terms){
  const p=String(l||"").split(" "),season=p[0],yr=p[1];
  if(terms&&yr){
    const dupes=terms.filter(t=>String(t.label||"").split(" ")[0]===season).length;
    if(dupes>1)return`${season} '${yr.slice(2)}`;
  }
  return season;
}

/* Shows which terms the loaded rows cover, and what sits outside the year. */
function TermCoverage({census={},terms,label="records"}){
  const known=new Set(terms.map(t=>t.label));
  const order={};terms.forEach((t,i)=>order[t.label]=i);
  const stray=Object.entries(census).filter(([k])=>!known.has(k)).sort((a,b)=>b[1]-a[1]);
  const inYear=Object.entries(census).filter(([k])=>known.has(k)).sort((a,b)=>order[a[0]]-order[b[0]]);
  if(!Object.keys(census).length)return null;
  return(<div style={{margin:"12px 0",padding:"10px 14px",borderRadius:10,background:stray.length?`${CO.yellow}0e`:`${CO.green}0a`,border:`1px solid ${stray.length?CO.yellow+"40":CO.green+"25"}`}}>
    <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
      <span style={{fontSize:11,color:stray.length?CO.yellow:CO.green,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em"}}>{stray.length?"⚠ Term coverage":"✓ Term coverage"}</span>
      {inYear.map(([k,v])=><span key={k} style={{fontSize:11,padding:"3px 10px",borderRadius:20,background:`${CO.green}18`,border:`1px solid ${CO.green}35`,color:CO.green,fontWeight:600}}>{k}: {v.toLocaleString()}</span>)}

/* Per-term unique-student counts for a set of rows. */
function useTermCounts(rows,terms,sidFn,field="Semester (course)"){
  return useMemo(()=>{
    const appr={},inter={};
    terms.forEach(t=>{appr[t.label]=new Set();inter[t.label]=new Set()});
    rows.forEach(r=>{
      const sem=normTerm(r[field]);const s=sidFn(r);
      if(inter[sem]){inter[sem].add(s);if((r["Approved"]||"").toLowerCase()==="approved")appr[sem].add(s);}
    });
    return terms.map(t=>({key:t.key,label:t.label,col:t.col,approved:appr[t.label].size,interacted:inter[t.label].size}));
  },[rows,terms,field]);
}

          sp(),mkHL([academicYear+": "+us.toLocaleString()+" registered students served.","Testing Center: "+examTotal.toLocaleString()+" exams administered across "+termList+"."].concat(combinedHrs!=="0.0"?["Total student support time: "+combinedHrs+" combined service hours."]:[])),

          ...[["approval",420,280],["classLevel",420,295],["semester",440,260],["academic",500,300],["housing",500,300]].flatMap(([key,w,h])=>[sp(),new D.Paragraph({spacing:{after:80},children:[new D.TextRun({text:charts[key].figLabel+" — "+charts[key].title,bold:true,size:24,color:"365F91",font:"Calibri"})]}),new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:200},children:[imgR(imgs[key],w,h)]})]).concat(imgs.services?[sp(),new D.Paragraph({spacing:{after:80},children:[new D.TextRun({text:"Figure 6 — Direct & Indirect Service Hours",bold:true,size:24,color:"365F91",font:"Calibri"})]}),new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:200},children:[imgR(imgs.services,480,280)]})]:[]),

/* ═══ DIRECT SERVICES TAB ═══ */
function DirectServicesTab({apptData,census,T,TERMS}){
  const teal="#22c5c5";
  const mins=r=>parseInt(r["Appointment Length"])||0;
  const sid=r=>r["Symplicity Student ID"]||r["Student ID"]||r["Name"]||"unknown";
  const isCancelled=r=>(r["Appointment Cancelled"]||"").toLowerCase()==="yes";

  // AppointmentDate is a raw date — derive the term from it (Jun/Jul -> Summer).
  const rows=useMemo(()=>apptData.map(r=>({...r,_term:semOf(r["AppointmentDate"])})),[apptData]);
  const delivered=useMemo(()=>rows.filter(r=>!isCancelled(r)),[rows]);
  const cancelled=useMemo(()=>rows.filter(isCancelled),[rows]);

  const totalHrs=(delivered.reduce((a,r)=>a+mins(r),0)/60).toFixed(1);
  const uniqueStudents=new Set(delivered.map(sid)).size;

  // Per-term breakdown, driven by the academic year's term list.
  const byTerm=useMemo(()=>TERMS.map(t=>{
    const d=delivered.filter(r=>r._term===t.label);
    return{...t,appts:d.length,hrs:(d.reduce((a,r)=>a+mins(r),0)/60).toFixed(1),students:new Set(d.map(sid)).size};
  }),[delivered,TERMS]);
  const inYearAppts=byTerm.reduce((a,t)=>a+t.appts,0);

  const byType=useMemo(()=>{const m={};delivered.forEach(r=>{const t=r["Appointment Type"]||"Unknown";if(!m[t])m[t]={count:0,mins:0,students:new Set()};m[t].count++;m[t].mins+=mins(r);m[t].students.add(sid(r))});return Object.entries(m).map(([name,v])=>({name,count:v.count,hours:(v.mins/60).toFixed(1),uniqueStudents:v.students.size})).sort((a,b)=>b.count-a.count)},[delivered]);

  const virtual=delivered.filter(r=>(r["Appointment Type"]||"").toLowerCase().includes("virtual"));
  const inperson=delivered.filter(r=>!(r["Appointment Type"]||"").toLowerCase().includes("virtual"));
  const virtualHrs=(virtual.reduce((a,r)=>a+mins(r),0)/60).toFixed(1);
  const inpersonHrs=(inperson.reduce((a,r)=>a+mins(r),0)/60).toFixed(1);

  const byStaff=useMemo(()=>{const m={};delivered.forEach(r=>{const st=r["Staff"]||"Unknown";if(!m[st])m[st]={count:0,mins:0,students:new Set()};m[st].count++;m[st].mins+=mins(r);m[st].students.add(sid(r))});return Object.entries(m).map(([name,v])=>({name,count:v.count,hours:(v.mins/60).toFixed(1),uniqueStudents:v.students.size})).sort((a,b)=>b.count-a.count)},[delivered]);

  const TypeBadge=({label})=>{const virt=label.toLowerCase().includes("virtual");return<span style={{fontSize:10,padding:"2px 8px",borderRadius:10,background:virt?`${CO.purple}20`:`${teal}20`,color:virt?CO.purple:teal,fontWeight:600}}>{virt?"Virtual":"In-Person"}</span>};

  if(!apptData.length)return<Empty msg="Import the Direct Service Appointments file from the Import tab."/>;

  return(<div className="fade-up">
    <h2 style={{fontSize:26,fontWeight:800,marginBottom:6}}>Direct Service Appointments</h2>
    <p style={{fontSize:13,color:CO.muted,marginBottom:14}}>One-on-one appointments delivered by OARS staff &mdash; excludes cancelled. Terms are derived from <strong style={{color:CO.text}}>AppointmentDate</strong>, so June&ndash;July dates land in Summer.</p>

    <TermCoverage census={census} terms={TERMS} label="appointments"/>
    <IdentityNote basis="Symplicity Student ID" color="#22c5c5" detail="This export carries no student name, so these students cannot be matched to the names in the Academic & Housing file. Add a Name column to the Accommodate export if you need to identify them."/>

    {/* Top stat cards */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:24}}>
      <SC label="Unique Students Served" value={uniqueStudents} color={teal}/>
      <SC label="Total Appointments" value={delivered.length} color={CO.accent} sub={`${byTerm.filter(t=>t.appts).map(t=>shortTerm(t.label,TERMS)).join(" + ")} combined`}/>
      <SC label="Total Hours of Service" value={totalHrs} color={CO.green}/>
      <SC label="Cancelled" value={cancelled.length} color={CO.red} sub={apptData.length?`${((cancelled.length/apptData.length)*100).toFixed(1)}% of all`:""}/>
    </div>

    {/* Semester + modality row */}
    <div style={{display:"grid",gridTemplateColumns:"1.4fr 1fr",gap:14,marginBottom:24}}>
      <div style={{background:CO.card,borderRadius:14,border:`1px solid ${CO.border}`,padding:20}}>
        <p style={{fontSize:12,color:"#b0b8d8",fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:14}}>By Semester</p>
        <div style={{display:"grid",gridTemplateColumns:`repeat(${TERMS.length},1fr)`,gap:10}}>
          {byTerm.map(t=>(
            <div key={t.label} style={{textAlign:"center",padding:"12px 8px",borderRadius:10,background:`${t.col}0c`,border:`1px solid ${t.col}25`}}>
              <p style={{fontSize:10,color:CO.dim,textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>{t.label}</p>
              <p style={{fontSize:22,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:t.col}}>{t.appts.toLocaleString()}</p>
              <p style={{fontSize:11,color:CO.muted,marginTop:2}}>{t.hrs} hrs</p>
              <p style={{fontSize:10,color:CO.dim,marginTop:1}}>{t.students} students</p>
            </div>
          ))}
        </div>
      </div>
      <div style={{background:CO.card,borderRadius:14,border:`1px solid ${CO.border}`,padding:20}}>
        <p style={{fontSize:12,color:"#b0b8d8",fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:14}}>In-Person vs Virtual</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {[{label:"In-Person",data:inperson,hrs:inpersonHrs,col:teal},{label:"Virtual",data:virtual,hrs:virtualHrs,col:CO.purple}].map(m=>(
            <div key={m.label} style={{textAlign:"center",padding:"14px 10px",borderRadius:10,background:`${m.col}0c`,border:`1px solid ${m.col}30`}}>
              <p style={{fontSize:11,color:m.col,fontWeight:700,marginBottom:6}}>{m.label}</p>
              <p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:m.col}}>{m.data.length}</p>
              <p style={{fontSize:12,color:CO.muted,marginTop:2}}>{m.hrs} hrs</p>
              <p style={{fontSize:11,color:CO.dim,marginTop:1}}>{new Set(m.data.map(sid)).size} unique students</p>
            </div>
          ))}
        </div>
      </div>
    </div>

    {/* By appointment type */}
    <div style={{marginBottom:24}}>
      <p style={{fontSize:12,color:"#b0b8d8",fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:12}}>Breakdown by Appointment Type</p>
      <div style={{background:CO.card,borderRadius:14,border:`1px solid ${CO.border}`,overflow:"hidden"}}>
        <div style={{overflow:"auto",maxHeight:"35vh"}}>
          <table><thead><tr><th>Appointment Type</th><th></th><th style={{textAlign:"right"}}>Appointments</th><th style={{textAlign:"right"}}>Hours</th><th style={{textAlign:"right"}}>Unique Students</th><th style={{textAlign:"right"}}>Avg/Student</th></tr></thead>
          <tbody>{byType.map((row,i)=>(
            <tr key={i}>
              <td style={{fontWeight:500,maxWidth:280}}>{row.name}</td>
              <td><TypeBadge label={row.name}/></td>
              <td style={{textAlign:"right",fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}}>{row.count}</td>
              <td style={{textAlign:"right"}}><span className="badge badge-green">{row.hours} hrs</span></td>
              <td style={{textAlign:"right",fontWeight:700,color:teal}}>{row.uniqueStudents}</td>
              <td style={{textAlign:"right",color:CO.muted,fontSize:12}}>{(row.count/row.uniqueStudents).toFixed(1)}x</td>
            </tr>
          ))}</tbody></table>
        </div>
      </div>
    </div>

    {/* By staff */}
    <div style={{marginBottom:16}}>
      <p style={{fontSize:12,color:"#b0b8d8",fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:12}}>Breakdown by Staff Member</p>
      <div style={{background:CO.card,borderRadius:14,border:`1px solid ${CO.border}`,overflow:"hidden"}}>
        <table><thead><tr><th>Staff Member</th><th style={{textAlign:"right"}}>Appointments</th><th style={{textAlign:"right"}}>Hours</th><th style={{textAlign:"right"}}>Unique Students</th><th style={{textAlign:"right"}}>Avg Appts/Student</th></tr></thead>
        <tbody>{byStaff.map((row,i)=>(
          <tr key={i}>
            <td style={{fontWeight:600}}>{row.name}</td>
            <td style={{textAlign:"right",fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}}>{row.count}</td>
            <td style={{textAlign:"right"}}><span className="badge badge-green">{row.hours} hrs</span></td>
            <td style={{textAlign:"right",fontWeight:700,color:teal}}>{row.uniqueStudents}</td>
            <td style={{textAlign:"right",color:CO.muted,fontSize:12}}>{(row.count/row.uniqueStudents).toFixed(1)}x</td>
          </tr>
        ))}
        <tr style={{background:`${teal}0c`}}>
          <td style={{fontWeight:700}}>TOTAL</td>
          <td style={{textAlign:"right",fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}}>{delivered.length}</td>
          <td style={{textAlign:"right",fontWeight:700,color:CO.green}}>{totalHrs} hrs</td>
          <td style={{textAlign:"right",fontWeight:700,color:teal}}>{uniqueStudents}</td>
          <td style={{textAlign:"right",color:CO.muted,fontSize:12}}>{uniqueStudents?(delivered.length/uniqueStudents).toFixed(1):0}x avg</td>
        </tr>
        </tbody></table>
      </div>
    </div>

    {/* Summary footer */}
    <div style={{padding:"18px 24px",borderRadius:14,background:`${teal}0c`,border:`1.5px solid ${teal}30`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:16}}>
      <div>
        <p style={{fontSize:11,color:teal,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:4}}>&#129309; Direct Services Summary</p>
        <p style={{fontSize:12,color:CO.dim}}>OARS staff delivered {totalHrs} hours of direct service to {uniqueStudents} unique students across {delivered.length} appointments.</p>
      </div>
      <div style={{display:"flex",gap:28}}>
        <StatBlock label="Unique Students" val={uniqueStudents} color={teal} size={28}/>
        <StatBlock label="Total Appointments" val={delivered.length} color={CO.accent} size={28}/>
        <StatBlock label="Total Hours" val={totalHrs} color={CO.green} size={28}/>
      </div>
    </div>
  </div>);

/* ═══ INDIRECT CONTACTS TAB ═══ */
function IndirectContactsTab({caseNotesData,studentNotesData,census={},census2={},T,TERMS}){
  const pink="#c522a0";const amber="#c57a22";const combined="#7a5cf0";
  if(!caseNotesData.length&&!studentNotesData.length)return<Empty msg="Import Case Notes and/or Student Notes files from the Import tab."/>;

  const getDur=r=>parseInt(r["Duration (Case)"]||r["Duration (Student)"]||0)||0;
  const getSid=r=>r["Symplicity Student ID"]||"unknown";
  const getStaff=r=>r["Name of Specialist"]||r["Created By (Student)"]||"Unknown";
  const getCat=r=>r["Category (Case)"]||r["Category (Student)"]||"Unknown";
  const getDate=r=>{
    const d=r["Created"]||r["Date Created (Student)"]||"";
    if(!d||d==="Invalid Date")return null;
    const dt=new Date(d);return isNaN(dt)?null:dt;
  };
  // Derive the term from the raw created-date (Jun/Jul -> Summer).
  const getSem=r=>semOf(r["Created"]||r["Date Created (Student)"]);

  // Normalize both sources into unified rows
  const caseRows=useMemo(()=>caseNotesData.map(r=>({...r,_src:"Case Notes",_sid:getSid(r),_staff:getStaff(r),_cat:getCat(r),_dur:getDur(r),_sem:getSem(r)})),[caseNotesData]);
  const studentRows=useMemo(()=>studentNotesData.map(r=>({...r,_src:"Student Notes",_sid:getSid(r),_staff:getStaff(r),_cat:getCat(r),_dur:getDur(r),_sem:getSem(r)})),[studentNotesData]);
  const all=useMemo(()=>[...caseRows,...studentRows],[caseRows,studentRows]);
  const mergedCensus=useMemo(()=>{const m={...census};Object.entries(census2).forEach(([k,v])=>m[k]=(m[k]||0)+v);return m},[census,census2]);

  // Totals
  const totalRecords=all.length;
  const totalMins=all.reduce((a,r)=>a+r._dur,0);
  const totalHrs=(totalMins/60).toFixed(1);
  const uniqueStudents=new Set(all.map(r=>r._sid)).size;

  // Case notes totals
  const cnMins=caseRows.reduce((a,r)=>a+r._dur,0);
  const cnHrs=(cnMins/60).toFixed(1);
  const cnUnique=new Set(caseRows.map(r=>r._sid)).size;

  // Student notes totals
  const snMins=studentRows.reduce((a,r)=>a+r._dur,0);
  const snHrs=(snMins/60).toFixed(1);
  const snUnique=new Set(studentRows.map(r=>r._sid)).size;

  // By semester
  const bySemStats=(rows,sem)=>{const s=rows.filter(r=>r._sem===sem);return{count:s.length,hrs:(s.reduce((a,r)=>a+r._dur,0)/60).toFixed(1),unique:new Set(s.map(r=>r._sid)).size}};
  const byTerm=useMemo(()=>TERMS.map(t=>({...t,s:bySemStats(all,t.label)})),[all,TERMS]);

  // By category (combined)
  const byCat=useMemo(()=>{const m={};all.forEach(r=>{const c=r._cat;if(!m[c])m[c]={count:0,mins:0,students:new Set()};m[c].count++;m[c].mins+=r._dur;m[c].students.add(r._sid)});return Object.entries(m).map(([name,v])=>({name,count:v.count,hrs:(v.mins/60).toFixed(1),unique:v.students.size})).sort((a,b)=>b.count-a.count)},[all]);

  // By staff (combined)
  const byStaff=useMemo(()=>{const m={};all.forEach(r=>{const s=r._staff;if(!m[s])m[s]={count:0,mins:0,students:new Set(),src:new Set()};m[s].count++;m[s].mins+=r._dur;m[s].students.add(r._sid);m[s].src.add(r._src)});return Object.entries(m).map(([name,v])=>({name,count:v.count,hrs:(v.mins/60).toFixed(1),unique:v.students.size})).sort((a,b)=>b.count-a.count)},[all]);

  return(<div className="fade-up">
    <h2 style={{fontSize:26,fontWeight:800,marginBottom:6}}>Indirect Contacts</h2>
    <p style={{fontSize:13,color:CO.muted,marginBottom:10}}>Case Notes + Student Notes combined &mdash; emails, phone calls, remote contacts, and case work on students' behalf. Terms are derived from the created date, so June&ndash;July contacts land in Summer.</p>
    <TermCoverage census={mergedCensus} terms={TERMS} label="indirect contacts"/>
    <IdentityNote basis="Symplicity Student ID" color="#7a5cf0" detail="Same identifier as Direct Services, so those two tabs can be compared with each other — but not with the name-based Academic, Housing or Testing tabs."/>

    {/* Top stat cards */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:20}}>
      <SC label="Unique Students" value={uniqueStudents} color={combined}/>
      <SC label="Total Contacts" value={totalRecords} color={CO.accent}/>
      <SC label="Total Hours" value={totalHrs} color={CO.green}/>
      <SC label="Avg Contacts/Student" value={uniqueStudents?(totalRecords/uniqueStudents).toFixed(1):0} color={CO.yellow}/>
    </div>

    {/* Source breakdown */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:20}}>
      {[{label:"📝 Case Notes",data:caseRows,hrs:cnHrs,unique:cnUnique,col:amber},{label:"🗒️ Student Notes",data:studentRows,hrs:snHrs,unique:snUnique,col:pink}].map(s=>(

      <p style={{fontSize:12,color:"#b0b8d8",fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:12}}>By Contact Category</p>
      <div style={{background:CO.card,borderRadius:14,border:`1px solid ${CO.border}`,overflow:"hidden"}}>
        <table><thead><tr><th>Category</th><th style={{textAlign:"right"}}>Contacts</th><th style={{textAlign:"right"}}>Hours</th><th style={{textAlign:"right"}}>Unique Students</th><th style={{textAlign:"right"}}>% of Total</th></tr></thead>
        <tbody>{byCat.map((row,i)=>(
          <tr key={i}>
            <td style={{fontWeight:500}}>{row.name}</td>
            <td style={{textAlign:"right",fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}}>{row.count.toLocaleString()}</td>
            <td style={{textAlign:"right"}}><span className="badge badge-green">{row.hrs} hrs</span></td>
            <td style={{textAlign:"right",color:combined,fontWeight:600}}>{row.unique.toLocaleString()}</td>
            <td style={{textAlign:"right",color:CO.muted,fontSize:12}}>{((row.count/totalRecords)*100).toFixed(1)}%</td>
          </tr>
        ))}
        <tr style={{background:`${combined}0c`}}>
          <td style={{fontWeight:700}}>TOTAL</td>
          <td style={{textAlign:"right",fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}}>{totalRecords.toLocaleString()}</td>
          <td style={{textAlign:"right",fontWeight:700,color:CO.green}}>{totalHrs} hrs</td>
          <td style={{textAlign:"right",fontWeight:700,color:combined}}>{uniqueStudents.toLocaleString()}</td>
          <td style={{textAlign:"right",color:CO.muted,fontSize:12}}>100%</td>

        </tbody></table>
      </div>
    </div>

    {/* By staff */}
    <div style={{marginBottom:16}}>
      <p style={{fontSize:12,color:"#b0b8d8",fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:12}}>By Staff Member</p>
      <div style={{background:CO.card,borderRadius:14,border:`1px solid ${CO.border}`,overflow:"hidden"}}>
        <table><thead><tr><th>Staff Member</th><th style={{textAlign:"right"}}>Contacts</th><th style={{textAlign:"right"}}>Hours</th><th style={{textAlign:"right"}}>Unique Students</th><th style={{textAlign:"right"}}>Avg/Student</th></tr></thead>
        <tbody>{byStaff.map((row,i)=>(
          <tr key={i}>
            <td style={{fontWeight:600}}>{row.name}</td>
            <td style={{textAlign:"right",fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}}>{row.count.toLocaleString()}</td>
            <td style={{textAlign:"right"}}><span className="badge badge-green">{row.hrs} hrs</span></td>
            <td style={{textAlign:"right",color:combined,fontWeight:600}}>{row.unique.toLocaleString()}</td>
            <td style={{textAlign:"right",color:CO.muted,fontSize:12}}>{(row.count/row.unique).toFixed(1)}x</td>
          </tr>
        ))}
        <tr style={{background:`${combined}0c`}}>
          <td style={{fontWeight:700}}>TOTAL</td>
          <td style={{textAlign:"right",fontWeight:700,fontFamily:"'JetBrains Mono',monospace"}}>{totalRecords.toLocaleString()}</td>
          <td style={{textAlign:"right",fontWeight:700,color:CO.green}}>{totalHrs} hrs</td>
          <td style={{textAlign:"right",fontWeight:700,color:combined}}>{uniqueStudents.toLocaleString()}</td>
          <td style={{textAlign:"right",color:CO.muted,fontSize:12}}>{uniqueStudents?(totalRecords/uniqueStudents).toFixed(1):0}x avg</td>
        </tr>
        </tbody></table>
      </div>
    </div>

    {/* Summary footer */}
    <div style={{padding:"18px 24px",borderRadius:14,background:`${combined}0c`,border:`1.5px solid ${combined}30`,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:16}}>
      <div>
        <p style={{fontSize:11,color:combined,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:4}}>📬 Indirect Contacts Summary</p>
        <p style={{fontSize:12,color:CO.dim}}>OARS staff logged {totalHrs} hours across {totalRecords.toLocaleString()} indirect contacts with {uniqueStudents.toLocaleString()} unique students.</p>
      </div>
      <div style={{display:"flex",gap:28}}>
        <StatBlock label="Unique Students" val={uniqueStudents} color={combined} size={28}/>
        <StatBlock label="Total Contacts" val={totalRecords} color={CO.accent} size={28}/>
        <StatBlock label="Total Hours" val={totalHrs} color={CO.green} size={28}/>

  </div>);
}

/* ═══ INCOMING STUDENTS TAB ═══ */
function IncomingTab({incomingData,T,TERMS}){
  const gold="#e6b94a";
  const pending_col="#f59e0b";
  const[clFilter,setClFilter]=useState("All");
  if(!incomingData.length)return<Empty msg="Import the Incoming Students file from the Import tab."/>;

  const sid=r=>r["Student ID"]||r["Name"]||"unknown";
  const accom=r=>r["Requested Accommodation"]||"";
  const status=r=>(r["_ApprovedStatus"]||"").toLowerCase();
  const isAppr=r=>status(r)==="approved";
  const isDen=r=>status(r)==="denied";

  // Class level grouping - handles Freshman, Incoming(generic), IncomingGR, IncomingDR
  const clGroup=r=>{
    const cl=(r["Class Level"]||"").trim().toLowerCase();
    if(cl==="incoming - freshman"||cl==="incomingfreshman")return"Freshman";
    if(cl==="incomingdr"||cl.includes("doc"))return"Doctoral";
    if(cl==="incominggr"||cl.includes("grad"))return"Graduate";
    return"Unclassified"; // plain "Incoming" or anything unrecognized
  };

  // filteredIncoming FIRST - everything downstream depends on it
  const filteredIncoming=useMemo(()=>{
    const base=incomingData.filter(r=>clGroup(r)!=="Incoming");
    return clFilter==="All"?base:base.filter(r=>clGroup(r)===clFilter);
  },[incomingData,clFilter]);

  // Enrolled = ALL unique students in file - always uses full incomingData regardless of filter
  const enrolledByType=useMemo(()=>{
    const sets={Freshman:new Set(),Graduate:new Set(),Doctoral:new Set(),Incoming:new Set()};
    incomingData.forEach(r=>{
      const s=sid(r);const g=clGroup(r);
      if(sets[g])sets[g].add(s);
    });
    return {Freshman:sets.Freshman.size,Graduate:sets.Graduate.size,Doctoral:sets.Doctoral.size,Incoming:sets.Incoming.size};
  },[incomingData]);
  const totalEnrolled=useMemo(()=>{
    const all=new Set();incomingData.forEach(r=>{if(clGroup(r)!=="Incoming")all.add(sid(r));});return all.size;
  },[incomingData]);

  // Cohort detection: Jan-Jul of a given year = incoming pre-fall cohort for that fall
  // Oct-Dec = registered during active school year (not incoming pipeline)
  const getCreatedYr=v=>{if(!v)return null;try{return parseInt(String(v).slice(0,4));}catch(e){return null;}};
  const getCreatedMo=v=>{if(!v)return null;try{return parseInt(String(v).slice(5,7));}catch(e){return null;}};
  const isPreFall=(v)=>{const mo=getCreatedMo(v);return mo>=1&&mo<=7;};  // Jan-Jul = pre-fall registration window
  const getCohortYear=v=>{
    // Returns the fall year this student is incoming FOR
    // Jan-Jul 2025 created → Fall 2025-2026 cohort
    // Jan-Jul 2026 created → Fall 2026-2027 cohort
    const yr=getCreatedYr(v);const mo=getCreatedMo(v);
    if(!yr||!mo)return null;
    if(mo>=1&&mo<=7)return yr;       // pre-fall = incoming for that fall
    if(mo>=8&&mo<=12)return yr+1;   // Aug-Dec = already enrolled, incoming for NEXT fall
    return null;
  };

  // Build cohort pipeline — all students with a Created date in the pre-fall window
  const buildCohort=(yearFilter)=>filteredIncoming.filter(r=>{
    const v=r["Created"];
    if(!v)return false;
    if(yearFilter&&getCohortYear(v)!==yearFilter)return false;
    return isPreFall(v);
  });

  // Available cohort years from the data
  const cohortYears=useMemo(()=>{
    const yrs=new Set();
    filteredIncoming.forEach(r=>{
      const v=r["Created"];if(!v)return;
      const y=getCohortYear(v);if(y)yrs.add(y);
    });
    return [...yrs].sort((a,b)=>b-a); // newest first
  },[filteredIncoming]);

  const[cohortYear,setCohortYear]=useState(null); // null = show latest

  const activeCohortYear=useMemo(()=>
    cohortYear||(cohortYears.length?cohortYears[0]:null)
  ,[cohortYear,cohortYears]);

  const pipelineRows=useMemo(()=>buildCohort(activeCohortYear),[filteredIncoming,activeCohortYear]);

  const pipeline=useMemo(()=>{
    const sMap={};
    pipelineRows.forEach(r=>{
      const s=sid(r);
      if(!sMap[s])sMap[s]={sid:s,name:r["Name"]||"",cl:clGroup(r),createdMo:getCreatedMo(r["Created"]),reqNum:r["Request #"]||"",rows:[]};
      sMap[s].rows.push(r);
    });
    return Object.values(sMap);
  },[pipelineRows]);

  const pipeByType=useMemo(()=>{
    const counts={Freshman:0,Graduate:0,Doctoral:0,Incoming:0};
    pipeline.forEach(s=>{if(counts[s.cl]!==undefined)counts[s.cl]++;});
    return counts;
  },[pipeline]);

  // Has accommodation = at least one row has a non-empty Requested Accommodation
  const pipeWithAccom=useMemo(()=>pipeline.filter(s=>s.rows.some(r=>(r["Requested Accommodation"]||"").trim())),[pipeline]);
  // Truly pending = has Created date (and Request#) but NO accommodation text at all
  const pipePending=useMemo(()=>pipeline.filter(s=>!s.rows.some(r=>(r["Requested Accommodation"]||"").trim())),[pipeline]);
  // Decisions made = has accommodation AND has approval date or status
  const pipeDecided=useMemo(()=>pipeWithAccom.filter(s=>s.rows.some(r=>r["_ApprovedDate"]||r["_ApprovedStatus"])),[pipeWithAccom]);
  // Awaiting decision = has accommodation but no decision yet
  const pipeAwaiting=useMemo(()=>pipeWithAccom.filter(s=>!s.rows.some(r=>r["_ApprovedDate"]||r["_ApprovedStatus"])),[pipeWithAccom]);

  // Month breakdown of pending students (for the activity chart)
  const pipePendingByMonth=useMemo(()=>{
    const mo={Jan:0,Feb:0,Mar:0,Apr:0,May:0,Jun:0,Jul:0};
    const names=["Jan","Feb","Mar","Apr","May","Jun","Jul"];
    pipePending.forEach(s=>{const m=s.createdMonth;if(m>=1&&m<=7)mo[names[m-1]]++;});
    return mo;
  },[pipePending]);

  // Legacy pending calc (all time, no Created date = no request)
  const pendingRows=useMemo(()=>filteredIncoming.filter(r=>{
    const reqNum=r["Request #"]||"";
    const apprDate=r["_ApprovedDate"]||"";
    const apprStatus=r["_ApprovedStatus"]||"";
    return reqNum&&!apprDate&&!apprStatus;
  }),[incomingData]);
  const totalPending=new Set(pendingRows.map(sid)).size;

  // Only rows that have an accommodation request with a decision
  const withAccom=useMemo(()=>filteredIncoming.filter(r=>accom(r).trim()&&(r["_ApprovedStatus"]||r["_ApprovedDate"])),[incomingData]);

  // Only students with at least one approval
  const approvedSids=useMemo(()=>new Set(withAccom.filter(isAppr).map(sid)),[withAccom]);
  const filtered=useMemo(()=>withAccom.filter(r=>approvedSids.has(sid(r))),[withAccom,approvedSids]);

  // Semester derived from the approval date (Jun/Jul -> Summer)
  const getSem=r=>{const d=r["_ApprovedDate"];return(!d||d==="None")?"Unknown":semOf(d)};
  const TKEY={};TERMS.forEach(t=>TKEY[t.label]=t.key);

  // Class label mapping
  const clLabel=cl=>{
    if(!cl)return"Unknown";
    const l=cl.toLowerCase();
    if(l.includes("freshman"))return"Incoming Freshman";
    if(l.includes("dr"))return"Incoming Doctoral";
    if(l.includes("gr"))return"Incoming Grad";
    return cl;
  };

  // Housing check
  const hKw=["housing accommodation","emotional support animal","service animal","accessible transport","single room","without suitemates","with suitemates"];
  const tKw=["extra time","distraction-reduced","paper copy of exam","no scantron","four-function calculator","reader assistive","consideration for computer","consideration for memory","consideration for spelling","break during","enlarged print","foreign language substitution"];
  const isTest=r=>tKw.some(k=>accom(r).toLowerCase().includes(k));
  const isHousing=r=>hKw.some(k=>accom(r).toLowerCase().includes(k));
  const isAcademic=r=>!isHousing(r);

  const acadRows=useMemo(()=>filtered.filter(isAcademic),[filtered]);
  const housRows=useMemo(()=>filtered.filter(isHousing),[filtered]);

  // Build accommodation summary for a set of rows
  const buildSummary=(rows)=>{
    const m={};
    rows.forEach(r=>{
      const a=accom(r);if(!a)return;
      if(!m[a]){m[a]={name:a,allAppr:new Set(),allDen:new Set(),t:{}};TERMS.forEach(t=>m[a].t[t.key]={A:new Set(),D:new Set()});}
      const k=TKEY[getSem(r)];const s=sid(r);
      if(isAppr(r)){m[a].allAppr.add(s);if(k)m[a].t[k].A.add(s);}
      else if(isDen(r)){m[a].allDen.add(s);if(k)m[a].t[k].D.add(s);}
    });
    return Object.values(m).map(v=>{
      const o={name:v.name,totalApproved:v.allAppr.size,totalDenied:v.allDen.size,
        totalStudents:new Set([...v.allAppr,...v.allDen]).size};
      TERMS.forEach(t=>{o[t.key+"Approved"]=v.t[t.key].A.size;o[t.key+"Denied"]=v.t[t.key].D.size});
      return o;
    }).sort((a,b)=>b.totalApproved-a.totalApproved);
  };

  const acadSummary=useMemo(()=>buildSummary(acadRows),[acadRows]);
  const housSummary=useMemo(()=>buildSummary(housRows),[housRows]);

  // Totals
  const sumCol=(arr,col)=>arr.reduce((a,r)=>a+r[col],0);
  const uniqueApprTotal=approvedSids.size;
  const uniqueTotal=new Set(withAccom.map(sid)).size;
  const deniedOnlySids=new Set([...new Set(withAccom.map(sid))].filter(s=>!approvedSids.has(s)));

  // By class type
  const byClass=useMemo(()=>{
    const types=["Incoming Freshman","Incoming Grad","Incoming Doctoral"];
    return types.map(label=>{
      const rows=filtered.filter(r=>clLabel(r["Class Level"])===label);
      const apprStudents=new Set(rows.filter(isAppr).map(sid));
      const allStudents=new Set(rows.map(sid));
      const deniedOnly=new Set([...allStudents].filter(s=>!apprStudents.has(s)));
      return{label,appr:apprStudents.size,denied:deniedOnly.size,total:allStudents.size,
        acadAppr:new Set(rows.filter(r=>isAppr(r)&&isAcademic(r)).map(sid)).size,
        housAppr:new Set(rows.filter(r=>isAppr(r)&&isHousing(r)).map(sid)).size,
        testAppr:new Set(rows.filter(r=>isAppr(r)&&isTest(r)).map(sid)).size};
    });
  },[filtered]);

  // Semester totals (unique students)
  const semStats=(sem)=>{
    const rows=withAccom.filter(r=>getSem(r)===sem);
    const appr=new Set(rows.filter(isAppr).map(sid));
    const total=new Set(rows.map(sid));
    const denied=new Set([...total].filter(s=>!appr.has(s)));
    return{appr:appr.size,denied:denied.size,total:total.size};
  };
  const termStats=TERMS.map(t=>({...t,s:semStats(t.label)}));

  const AccomTable=({summary,color})=>(
    <div style={{background:CO.card,borderRadius:14,border:`1px solid ${CO.border}`,overflow:"hidden",marginBottom:20}}>
      <div style={{overflow:"auto",maxHeight:"38vh"}}>
        <table><thead><tr>
          <th>Accommodation</th>
          {TERMS.map(t=>[<th key={t.key+"a"} style={{textAlign:"right",color:t.col}}>{shortTerm(t.label,TERMS)} Appr.</th>,<th key={t.key+"d"} style={{textAlign:"right",color:CO.dim}}>{shortTerm(t.label,TERMS)} Den.</th>])}
          <th style={{textAlign:"right",color}}>Total Appr.</th>
          <th style={{textAlign:"right"}}>Total Den.</th>
        </tr></thead>
        <tbody>{summary.map((row,i)=>(
          <tr key={i}>
            <td style={{fontWeight:500,maxWidth:260}}>{row.name}</td>
            {TERMS.map(t=>[
              <td key={t.key+"a"} style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",color:row[t.key+"Approved"]?t.col:CO.dim}}>{row[t.key+"Approved"]||"\u2014"}</td>,
              <td key={t.key+"d"} style={{textAlign:"right",fontFamily:"'JetBrains Mono',monospace",color:row[t.key+"Denied"]?CO.red:CO.dim}}>{row[t.key+"Denied"]||"\u2014"}</td>])}
            <td style={{textAlign:"right",fontWeight:700,color}}>{row.totalApproved}</td>
            <td style={{textAlign:"right",color:CO.red}}>{row.totalDenied||"\u2014"}</td>
          </tr>
        ))}
        <tr style={{background:`${color}0c`}}>
          <td style={{fontWeight:700}}>TOTAL</td>
          {TERMS.map(t=>[
            <td key={t.key+"a"} style={{textAlign:"right",fontWeight:700,color:t.col}}>{sumCol(summary,t.key+"Approved")}</td>,
            <td key={t.key+"d"} style={{textAlign:"right",color:CO.dim}}>{sumCol(summary,t.key+"Denied")||"\u2014"}</td>])}
          <td style={{textAlign:"right",fontWeight:700,color}}>{sumCol(summary,"totalApproved")}</td>
          <td style={{textAlign:"right",color:CO.red}}>{sumCol(summary,"totalDenied")||"\u2014"}</td>
        </tr>
        </tbody></table>
      </div>
    </div>
  );

  return(<div className="fade-up">
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,flexWrap:"wrap",gap:10}}>
      <div>
        <h2 style={{fontSize:26,fontWeight:800,marginBottom:4}}>🎓 New Student Registrations</h2>
        <p style={{fontSize:13,color:CO.muted}}>Incoming Freshman, Graduate, and Doctoral students — only those with at least one approved accommodation shown in detail.</p>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:11,color:CO.muted,marginRight:4}}>Filter by type:</span>
        {["All","Freshman","Graduate","Doctoral"].map(f=>(
          <button key={f} onClick={()=>setClFilter(f)} style={{fontSize:12,padding:"5px 14px",borderRadius:20,cursor:"pointer",fontWeight:600,background:clFilter===f?gold:"transparent",color:clFilter===f?"#0a0e1a":CO.muted,border:`1.5px solid ${clFilter===f?gold:CO.border}`,transition:"all .15s"}}>{f}</button>
        ))}
      </div>
    </div>

    {/* Enrollment by type */}
    <div style={{marginBottom:20}}>
      <p style={{fontSize:12,color:gold,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>Enrolled in Accommodate — by Class Type</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:10}}>
        {[["Freshman",CO.orange],["Graduate",CO.green],["Doctoral",CO.accent]].map(([label,col])=>(
          <div key={label} style={{background:CO.card,borderRadius:12,border:`1.5px solid ${col}30`,padding:"14px 16px"}}>
            <p style={{fontSize:10,color:col,fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",marginBottom:6}}>{label}</p>
            <p style={{fontSize:28,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:col}}>{(enrolledByType[label]||0).toLocaleString()}</p>
            <p style={{fontSize:10,color:CO.dim,marginTop:2}}>enrolled</p>
          </div>
        ))}
      </div>
      <div style={{padding:"10px 16px",borderRadius:10,background:`${gold}10`,border:`1px solid ${gold}30`,display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
        <span style={{fontSize:13,fontWeight:700,color:gold}}>Total Enrolled: {totalEnrolled.toLocaleString()}</span>
        <span style={{fontSize:11,color:CO.dim}}>unique students registered in Accommodate across all incoming groups</span>
      </div>
    </div>

    {/* 2026-2027 Pipeline */}
    {pipeline.length>0&&<div style={{marginBottom:20,padding:"18px 20px",borderRadius:14,background:`${pending_col}0a`,border:`1.5px solid ${pending_col}40`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <p style={{fontSize:12,color:pending_col,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em"}}>🎓 Incoming Pipeline — Fall {activeCohortYear}–{activeCohortYear&&activeCohortYear+1}</p>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontSize:11,color:CO.muted}}>Cohort year:</span>
          {cohortYears.map(y=>(

      </div>

      {/* Pending by month */}
      {pipePending.length>0&&<div style={{marginTop:10}}>
        <p style={{fontSize:11,color:CO.red,fontWeight:600,marginBottom:8}}>⏳ {pipePending.length} students have a Request # but no accommodation on file yet — by month submitted:</p>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {Object.entries(pipePendingByMonth).filter(([,v])=>v>0).map(([mo,ct])=>(
            <div key={mo} style={{padding:"6px 12px",borderRadius:8,background:`${CO.red}15`,border:`1px solid ${CO.red}30`,textAlign:"center"}}>
              <p style={{fontSize:10,color:CO.muted,marginBottom:2}}>{mo}</p>

    </div>}

    {/* Top stat cards */}
    <p style={{fontSize:12,color:CO.accent,fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:10}}>Students with Completed Accommodation Decisions</p>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:24}}>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:24}}>

        <div key={x.label} style={{background:CO.card,borderRadius:14,border:`1.5px solid ${x.col}30`,padding:"18px 20px"}}>

          <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
            <div style={{textAlign:"center",padding:"10px 14px",borderRadius:10,background:`${CO.green}0c`}}>

              <p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.green}}>{x.s.appr}</p>
              <p style={{fontSize:10,color:CO.dim,marginTop:1}}>unique students</p>
            </div>
            <div style={{textAlign:"center",padding:"10px 14px",borderRadius:10,background:`${CO.red}0c`}}>
              <p style={{fontSize:10,color:CO.dim,textTransform:"uppercase",letterSpacing:".05em",marginBottom:2}}>Denied All</p>
              <p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:CO.red}}>{x.s.denied}</p>
              <p style={{fontSize:10,color:CO.dim,marginTop:1}}>unique students</p>
            </div>
            <div style={{textAlign:"center",padding:"10px 14px",borderRadius:10,background:`${x.col}0c`}}>
              <p style={{fontSize:10,color:CO.dim,textTransform:"uppercase",letterSpacing:".05em",marginBottom:2}}>Total</p>
              <p style={{fontSize:26,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",color:x.col}}>{x.s.total}</p>
              <p style={{fontSize:10,color:CO.dim,marginTop:1}}>interacted</p>
